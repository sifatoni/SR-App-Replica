<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokrio SR App Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600;1,700&family=Anek+Bangla:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{--t:#1591a1;--t2:#2096a5;--g:#1aac7a;--bg:#fafafa;--m3:#fef7ff;--ink:#212121;--mut:#757575;--red:#f44336;--org:#fb6340}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e9edf0}
body{font-family:'Anek Bangla',system-ui,sans-serif;color:#1e2a44;padding-block:20px 40px;padding-inline:16px}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}
.top{max-width:980px;margin:0 auto 14px}
.top .eb{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--t);text-transform:uppercase}
.top h1{font-size:24px;font-weight:700;line-height:1.25}
.top p{font-size:13.5px;color:#5b6472;max-width:80ch;margin-top:4px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.flow button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid #d5dde3;color:#5b6472}
.flow button.on{background:var(--t);border-color:var(--t);color:#fff}
.stage{display:flex;justify-content:center}
.phone{position:relative;background:linear-gradient(145deg,#3a3d42,#17191c 40%,#2b2e33);border-radius:44px;padding:14px;box-shadow:0 0 0 2px #55595f,0 30px 60px -30px rgba(0,0,0,.6);zoom:.7397}
.phone::after{content:"";position:absolute;left:50%;top:30px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#050608;box-shadow:inset 0 0 0 3px #1c1f24;z-index:40}
@media (max-width:460px){.phone{zoom:.62}}
/* ---------- device (all sizes in screenshot pixels, 557 x 998) ---------- */
.scr{position:relative;width:557px;height:1237px;border-radius:30px;overflow:hidden;background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.sb{flex:0 0 40px;height:40px;padding-top:6px!important;display:flex;align-items:center;gap:7px;padding:0 6px;font:500 12px/1 Roboto,Poppins,sans-serif;color:#3b3b3b;z-index:3}
.sb svg{flex:0 0 auto}
.sb.dk{background:var(--t);color:#fff}.sb.dk svg{filter:brightness(0) invert(1)}.sb.dk b{color:#fff!important}.sb .gps{margin-left:auto}
.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.center{text-align:center}
/* login */
.lg{padding:20px 43px 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.lg h1{font-size:52px;font-weight:500;line-height:1;text-align:center;margin-top:12px;letter-spacing:-.5px}
.lg .sub{font-size:24px;color:var(--mut);text-align:center;margin-top:2px}
.lg .logo{display:block;width:52px;margin:30px auto 0}
.lg .brand{font-size:22px;font-weight:600;color:var(--t);text-align:center;letter-spacing:1px;margin-top:-4px}
.fl{font-size:23px;font-weight:500;margin-top:40px}
.fl+.box{margin-top:5px}
.lg .fl{margin-top:30px}
.lg .clogo{display:block;width:230px;margin:48px auto 0}
.lg .fl.f1{margin-top:70px}
.box{display:flex;align-items:center;height:82px;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.07);padding:0 9px}
.box input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--ink);height:100%}
.box input::placeholder{color:var(--mut)}
.box .eye{color:#9e9e9e;display:flex;padding-top:24px}
.forgot{display:block;margin:18px 0 0 auto;font-size:22px;color:#64b5e8}
.fpw{position:relative;width:76px;height:76px;margin:40px auto 0;border-radius:50%;border:1.5px solid #6cbcc6;display:flex;align-items:center;justify-content:center}
.fpw img{width:62px;opacity:.9}
.fpw .lk{position:absolute;left:-26px;top:22px;width:28px;height:28px}
.btnp{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:70px;border-radius:10px;background:var(--t);color:#fff;font-size:28px;font-weight:400;box-shadow:0 3px 6px rgba(0,0,0,.18)}
.btnp small{font-size:18px}
.lg .btnp{margin-top:60px}
/* today's plan / sync */
.m3{background:var(--m3)}
.tp{padding:0 44px}
.tp .logo{display:block;width:80px;margin:52px auto 0}
.tp h1{font-size:52px;font-weight:400;text-align:center;line-height:1.1;margin-top:36px}
.tp .sub{font-size:24px;color:var(--mut);text-align:center;margin-top:6px}
.tp .terr{font-size:28px;font-weight:600;color:var(--g);text-align:center;margin-top:18px}
.tp .amt{font-size:24px;font-weight:400;margin-top:22px}
.tlist{background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);height:353px;margin-top:4px;padding:30px 26px 0 27px}
.trow{display:flex;justify-content:space-between;align-items:center;height:44px;font-size:14px;width:100%;text-align:left}
.cb{width:15px;height:15px;border:1.6px solid #555;border-radius:2px;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--t);border-color:var(--t)}
.tp .btnp{margin:35px 0 0 7px;width:calc(100% - 14px)}
.netbar{flex:0 0 86px;display:flex;align-items:center;background:#fff;border-top:1px solid #eee;padding:0 30px}
.netbar>div{flex:1;display:flex;align-items:center;gap:15px}
.netbar>i{width:1px;height:46px;background:#e0e0e0;margin:0 24px}
.nic{width:62px;height:62px;border-radius:10px;background:#e8f6f1;display:flex;align-items:center;justify-content:center;color:var(--g)}
.netbar p span{display:block;font-size:14px;color:#9e9e9e;line-height:1.2}
.netbar p b{display:block;font-size:18px;font-weight:600;color:var(--g);line-height:1.3}
.sync h1{font-size:52px;font-weight:400;text-align:center;margin-top:142px;line-height:1.1}
.ring{width:362px;height:362px;border-radius:50%;border:3px solid var(--g);margin:34px auto 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring>div{width:330px;height:250px}
.sync .msg{font-size:12px;text-align:center;margin-top:62px;min-height:18px}
/* day in */
.dayin{background:#fff;position:relative}
.skip{position:absolute;right:14px;top:12px;height:25px;padding:0 10px;border:1px solid var(--t);border-radius:13px;color:var(--t);font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;z-index:2}
.dayin .logo{display:block;width:192px;margin:98px auto 0}
.dayin .brand{font-size:19px;font-weight:600;color:var(--t);text-align:center;margin-top:-8px;letter-spacing:.5px}
.dayin .ct{font-size:18px;color:var(--t);text-align:center;margin-top:330px}
.dayin .cv{font-size:16px;color:#424242;text-align:center;margin-top:6px}
.slide{position:absolute;left:20px;right:20px;bottom:22px;height:54px;border-radius:27px;background:#73bdc7;overflow:hidden;touch-action:none;user-select:none}
.slide .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5a5a5a;padding-left:40px}
.slide .txt b{font-weight:500;color:#2a2a2a;margin-left:4px}
.slide .kn{position:absolute;left:0;top:0;width:54px;height:54px;border-radius:50%;background:var(--t);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .25s;cursor:grab}
.slide.drag .kn{transition:none}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:center;justify-content:center}
.hello{position:absolute;left:125px;top:calc(50% - 272px);width:311px;height:544px;background:#fff5f5;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:0 16px;z-index:11}
.hello h3{font-size:20px;font-weight:700;color:var(--t);text-align:center;margin-top:16px}
.hello .x{position:absolute;right:18px;top:18px;color:#9e9e9e}
.hello .av{width:54px;height:54px;border-radius:50%;border:2px solid var(--t);margin:10px auto 0;overflow:hidden;padding:2px}
.hello .av img{width:100%;height:100%;border-radius:50%;display:block}
.hello .nm{font-size:14px;font-weight:700;font-style:italic;color:var(--t);text-align:center;margin-top:6px}
.hello .wb{background:#fff;border:1px solid #eee;border-radius:8px;height:154px;margin-top:16px;text-align:center;padding-top:12px}
.hello .wb small{display:block;font-size:10px;color:#9e9e9e}
.hello .wb b{font-size:15px;font-weight:700;color:#9e9e9e}
.hello .wb b span{font-weight:400;color:var(--ink)}
.hello .lr{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:#424242}
.hello .lr span{display:flex;align-items:center;gap:6px}
.hello .cl{background:#f5f5f5;border-radius:6px;padding:9px 10px;margin-top:10px;min-height:72px}
.hello .cl .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.hello .cl .h span{display:flex;align-items:center;gap:7px}
.hello .cl .h button{font-size:10px;font-weight:700;color:var(--t);display:flex;align-items:center;gap:3px}
.hello .cl p{font-size:11px;line-height:1.5;margin-top:6px;color:#424242}
.hello .go{position:absolute;left:68px;bottom:23px;width:174px;height:36px;border-radius:18px;background:var(--t);color:#fff;font-size:13px;font-weight:600}
/* app bars */
.ab{flex:0 0 48px;margin-top:-2px;display:flex;align-items:flex-start;justify-content:space-between;padding:0 16px 0 22px;position:relative;z-index:2}
.ab h2{position:absolute;left:90px;right:90px;top:0;line-height:44px;text-align:center;font-size:26px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx{width:58px;height:44px;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--t);position:relative}
.ibx .bdg{position:absolute;right:4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#ff5252;color:#fff;font:500 13px/20px Roboto,sans-serif;text-align:center;padding:0 4px;border:2px solid #fff}
.abt{background:var(--t);border-radius:0 0 0 0}
.abt h2{color:#fff;font-weight:600}
.abt .ibx{background:rgba(255,255,255,.12);box-shadow:none;color:#fff}
/* home */
.home{padding:8px 25px 140px 31px}
.banner{display:block;width:501px;height:153px;object-fit:fill;border-radius:2px}
.hc2{display:grid;grid-template-columns:238px 238px;gap:19px;margin:26px 0 0 3px}
.hc2.one{grid-template-columns:495px;margin-top:6px}
.hcard.big i{right:16px;top:16px;width:64px;height:64px}
.hcard.big i img{width:44px}
.hcard{position:relative;height:176px;border-radius:8px;padding:72px 22px 0 16px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.1);background:#fff}
.hcard.t{background:var(--t);color:#fff}
.hcard b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.hcard span{display:block;font-size:18px;line-height:1.45;color:#9e9e9e}
.hcard.t span{color:#fff}
.hcard i{position:absolute;right:11px;top:11px;width:36px;height:36px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.hcard i img{width:24px}
.grid{display:grid;grid-template-columns:repeat(3,153px);column-gap:18px;row-gap:15px;margin:37px 0 0 3px}
.tile{height:135px;border-radius:8px;background:var(--m3);box-shadow:0 2px 5px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:21px;font-weight:500;line-height:1.45;text-align:center;color:var(--ink)}
.tile img{width:40px;height:40px;object-fit:contain}
.bnav{position:absolute;left:8px;right:8px;bottom:8px;height:92px;border-radius:44px;background:var(--m3);box-shadow:0 -2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-around;padding:0 40px;z-index:4}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--t);min-width:60px}
.bnav img{width:32px;height:32px}
/* my outlets */
.srch{display:flex;align-items:center;height:52px;margin:7px 25px 0 31px;background:#fff;border-radius:8px;padding:0 14px 0 15px}
.srch input{flex:1;border:none;outline:none;font-size:24px;color:var(--ink);background:none}
.srch input::placeholder{color:#9e9e9e}
.srch svg{color:#9e9e9e}
.otabs{display:flex;height:38px;margin:20px 25px 0 31px;background:#fff;border-radius:4px}
.otabs button{flex:1;font-size:18px;font-weight:500;color:var(--ink);border-radius:4px}
.otabs button.on{background:var(--t);color:#fff}
.cnts{display:flex;justify-content:space-between;margin:38px 26px 0 31px;font-size:23px;color:#424242}
.olist{padding:20px 27px 80px 34px;display:flex;flex-direction:column;gap:17px}
.oc{background:#fdfdfd;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.14);padding:15px 18px 17px}
.oc.ci{background:#ead196}
.oc .top2{display:flex;gap:16px;margin-right:24px}
.oc .ph{width:128px;height:117px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#ddd}
.oc .inf{flex:1;min-width:0;position:relative}
.oc .nmr{display:flex;align-items:flex-start;gap:6px}
.oc .nmr b{flex:1;min-width:0;font-size:24px;font-weight:600;line-height:1.43;color:var(--t)}
.oc.ci .nmr b{color:#111}
.oc .mt{flex:0 0 120px;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding-top:9px;font-size:18px}
.oc .mt div{display:flex;align-items:center;justify-content:space-between;line-height:1}
.oc .mt svg{color:#616161}
.oc .mt .dots{font-size:10px;color:#616161;text-align:right;display:block;margin:-6px 0 -4px;letter-spacing:1px}
.oc .mt .ds{color:#e53935}
.oc .mt .ag{color:#616161}
.oc .kv{font-size:16px;color:#7b7b7b;line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:clip}
.oc .kv b{font-weight:500;color:#616161}
.oc .kv .tl{color:var(--t);font-weight:400}
.oc .kv .rd{color:var(--org);font-weight:500;font-size:17px}
.oc hr{border:none;border-top:1px solid #4e9fa9;margin:8px 0 10px}
.oc .acts{display:flex;justify-content:space-between;padding:0 20px}
.oc .acts button{width:120px;height:30px;background:#f5f5f5;border:1px solid #dcdcdc;border-radius:2px;font-size:16px;color:var(--ink)}
.fab{position:absolute;right:13px;bottom:14px;width:32px;height:32px;border-radius:50%;background:#ff6b6b;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:4}
/* interface popup */
.ifp{position:absolute;left:33px;top:calc(50% - 130px);width:498px;height:261px;background:#fff;border-radius:16px;z-index:11;text-align:center}
.ifp h3{font-size:15px;font-weight:500;color:var(--t);margin-top:18px}
.ifp .x{position:absolute;right:18px;top:18px;color:#9e9e9e}
.ifp p{font-size:13px;margin-top:14px}
.ifp .ch{display:flex;justify-content:center;gap:57px;margin-top:3px}
.ifp .ch button{width:145px;height:168px;background:#e6f3f4;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
.ifp .ch img{width:112px;height:112px}
/* last 3 orders after check-in */
.l3{position:absolute;left:33px;right:33px;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;z-index:11;padding:18px 18px 20px}
.l3h{display:flex;align-items:center;gap:12px}
.l3h .ok{width:38px;height:38px;border-radius:50%;background:#1aac7a;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.l3h b{display:block;font-size:17px;font-weight:600;color:var(--t);line-height:1.2}
.l3h small{display:block;font-size:13px;color:#757575}
.l3h .x{margin-left:auto;align-self:flex-start;color:#9e9e9e}
.l3t{font-size:15px;font-weight:600;margin:16px 0 8px}
.l3l{display:flex;flex-direction:column;gap:10px}
.l3c{border-radius:8px;overflow:hidden;background:var(--m3);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.l3c .hh{height:38px;background:var(--t);color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;font-weight:500}
.l3c .hh img{width:16px;filter:brightness(10)}
.l3c .st{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fff}
.l3c .st.g{color:#1aac7a}.l3c .st.o{color:#f57c00}.l3c .st.r{color:#e53935}
.l3b{padding:6px 14px 8px}
.l3r{display:flex;justify-content:space-between;font-size:12px;color:#8a8a8a;padding:3px 0 5px;border-bottom:1px solid #e5dde6;margin-bottom:3px}
.l3r b{font-weight:500;color:#333}
.l3i{display:flex;justify-content:space-between;font-size:13px;color:#424242;padding:2px 0}
.l3i span:last-child{color:#616161}
.btnp.l3n{height:54px;font-size:22px;margin-top:16px}
.ocg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oc2{position:relative;border:1px solid #e6e6e6;border-radius:8px;padding:30px 10px 10px;text-align:center;background:#fff}
.oc2 .tg{position:absolute;left:0;right:0;top:0;color:#fff;font-size:11.5px;font-weight:700;padding:5px 4px;border-radius:7px 7px 0 0;letter-spacing:.2px}
.oc2 img{width:74px;height:74px;object-fit:contain;display:block;margin:2px auto 4px}
.oc2 b{display:block;font-size:12.5px;font-weight:600;line-height:1.25}
.oc2 small{display:block;font-size:10px;color:#9e9e9e;margin-top:2px}
.oc2 p{font-size:10.5px;color:#616161;margin-top:4px;line-height:1.35}
.cmb{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--t);border-radius:8px;padding:10px}
.cmbi{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;text-align:center;width:96px}
.cmbi img{width:64px;height:64px;object-fit:contain}
.cmb>i{font-style:normal;font-size:22px;color:var(--t);font-weight:700}
.cmbo{flex:1;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.cmbo small{font-size:10px;color:#757575}.cmbo b{font-size:20px;color:var(--t)}.cmbo s{font-size:11px;color:#9e9e9e}
.cmbo em{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#e53935;border-radius:10px;padding:2px 8px;margin-top:3px}
.nob{background:#f2fafb;border:1px solid #d9eef1;border-radius:6px;padding:10px;font-size:12px;line-height:1.5}
.nob b{color:var(--t)}
.pdfv{background:#e3e5e8}
.pgs{padding:14px 18px 30px;display:flex;flex-direction:column;gap:16px}
.pg{position:relative;background:#fff;aspect-ratio:1/1.414;padding:30px 28px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-family:Poppins,sans-serif;color:#222;overflow:hidden}
.pg .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-30deg);font-style:normal;font-size:96px;font-weight:700;color:rgba(21,145,161,.06);letter-spacing:8px;pointer-events:none}
.pgh{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--t);padding-bottom:12px}
.pgh img{width:120px}
.pgh b{display:block;font-size:20px;font-weight:700;color:var(--t);text-align:right}
.pgh span{display:block;font-size:13px;color:#757575;text-align:right}
.pgm{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#616161;margin-top:12px}
.pgm b{color:#222;font-weight:600}
.pgk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pgk div{border:1px solid #d9eef1;background:#f2fafb;border-radius:6px;padding:8px 10px}
.pgk small{display:block;font-size:10.5px;color:#757575}
.pgk b{font-size:16px;font-weight:700}
.pgk em{font-style:normal;font-size:11px;color:#1aac7a;font-weight:600}
.pgt{font-size:14px;font-weight:700;color:var(--t);margin:16px 0 6px}
.pgtb{width:100%;border-collapse:collapse;font-size:11.5px}
.pgtb th{background:var(--t);color:#fff;font-weight:600;text-align:left;padding:6px 8px}
.pgtb td{padding:6px 8px;border-bottom:1px solid #eee}
.pgtb .r{text-align:right}
.pgtb tr:nth-child(even) td{background:#fafafa}
.pgtb .tt td{font-weight:700;border-top:1.5px solid #222;background:#fff}
.pgl{margin:0 0 0 18px;font-size:12px;line-height:1.7}
.pgn{margin-top:16px;font-size:11px;color:#9e9e9e;font-style:italic}
.pgf{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:10px;color:#9e9e9e}
.pdfb{flex:0 0 auto;background:#fff;padding:12px 22px 22px;box-shadow:0 -2px 8px rgba(0,0,0,.08);position:relative}
.pdfb span{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 12px;border-radius:12px}
.pdfb .btnp{height:60px;font-size:24px}
/* order history */
.chipr{display:flex;gap:16px;margin:24px 0 0 32px;overflow-x:auto;scrollbar-width:none}
.chipr::-webkit-scrollbar{display:none}
.chipr button{flex:0 0 auto;height:28px;padding:0 6px;border:1px solid #d6d6d6;background:#f6f6f6;font-size:18px;color:#7c7b7b}
.chipr button.on{background:var(--t);border-color:var(--t);color:#fff}
.dtab{display:flex;align-items:center;height:43px;margin:24px 24px 0 23px;background:#fff;border-radius:6px}
.dtab button{flex:1;height:100%;font-size:20px;color:#9e9e9e;border-radius:6px;position:relative}
.dtab button.on{background:var(--t);color:#fff}
.dtab i{width:1px;height:16px;background:#bdbdbd}
.hlist{padding:32px 23px 40px 25px;display:flex;flex-direction:column;gap:13px}
.hcd{border-radius:8px;overflow:hidden;background:var(--m3);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hcd .hh{height:48px;background:var(--t);color:#fff;display:flex;align-items:center;gap:8px;padding:0 26px;font-size:17px}
.hcd .hh b{font-size:19px;font-weight:500}
.hcd .hh img{width:20px;filter:brightness(10)}
.hcd .rw{display:flex;align-items:center;height:48px;padding:0 24px;font-size:18px;color:#8a8a8a}
.hcd .rw+.rw{border-top:1px solid #d1cad3}
.hcd .rw>div{flex:1;display:flex;gap:8px}
.hcd .rw>div:last-child{justify-content:flex-end}
.hcd .rw b{font-weight:400;color:#333}
.hcd .rw i{color:#9e9e9e;font-style:normal}
/* order (new interface) */
.ohead{flex:0 0 66px;background:var(--t);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ohead h2{position:absolute;left:80px;right:80px;top:0;line-height:66px;text-align:center;color:#fff;font-size:26px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohead button{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;z-index:1;color:#fff;display:flex;align-items:center;justify-content:center}
.otb{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 7px 0 14px;font-size:12px;color:var(--t);background:var(--m3)}
.otb button{display:flex;align-items:center;gap:6px;color:var(--t);font-size:12px}
.plist{padding:6px 10px 420px 10px;display:flex;flex-direction:column;gap:10px;background:var(--m3)}
.pc{background:#fff;border-radius:8px;border:1px solid #efe9ef;padding:10px 10px 10px 10px}
.pc .t1{display:flex;gap:12px;align-items:center}
.pc .pim{width:96px;height:96px;object-fit:contain;flex:0 0 auto;border-radius:6px;background:#fff}
.pc .pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.pc .pn{font-size:18px;font-weight:600;line-height:1.25}
.pc .lr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc .lot{font-size:13px;color:#616161;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .stk{flex:0 0 auto;height:26px;border:1px solid var(--t);border-radius:13px;padding:0 9px;font-size:12.5px;color:#424242;display:flex;align-items:center;gap:4px}
.pc .stk svg{color:var(--t);width:15px;height:15px}
.pc .prr{display:flex;align-items:baseline;justify-content:space-between}
.pc .pr{font-size:15px;color:#616161}
.pc .lt{font-size:19px;font-weight:700;color:var(--ink)}
.pc .t2{display:flex;align-items:center;gap:4px;margin-top:4px}
.pc .t2>*{flex:0 0 auto}
.pc .t2 .stp{flex:1 1 auto;width:auto;height:52px;padding:0;overflow:hidden}
.pc .t2 .stp button{width:60px;height:100%;background:#e8f4f6;font-size:24px}
.pc .t2 .stp button:active{background:#cfe9ed}
.pc .t2 .stp input{flex:1;width:auto;min-width:0;font-size:18px;font-weight:500}
.pc .t2 .qc{width:52px;height:52px;font-size:16px}
.pc .t2{gap:8px;margin-top:10px}
.pc .t2 .qc+.qc{margin-left:0}
.dsc{width:128px;height:44px;border:1px solid #f4511e;border-radius:6px;color:#f4511e;font-size:12px}
.stp{width:261px;height:44px;border:1px solid var(--t);border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.stp button{width:28px;height:36px;color:var(--t);font-size:20px;display:flex;align-items:center;justify-content:center}
.stp input{width:80px;text-align:center;border:none;outline:none;font-size:14px;color:#424242;background:none}
.qc{width:40px;height:40px;border-radius:50%;background:var(--t);color:#fff;font-size:12px;font-weight:600;margin-left:0}
.qc+.qc{margin-left:5px}
.cfab{position:absolute;right:18px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--t);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #dff1f3,0 3px 8px rgba(0,0,0,.3);z-index:4}
.cfab span{position:absolute;right:-4px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:#ff5252;font:600 10px/18px Roboto,sans-serif;text-align:center;padding:0 4px}
.cmp{padding:0!important;background:#fff}.cmp .top{display:none}.cmp .stage{justify-content:flex-start;gap:20px}.cmp .phone{zoom:1;padding:0;border-radius:0;box-shadow:none}.cmp .scr{border-radius:0}.cmp .ref{width:557px;height:998px}
.cmp .phone{zoom:1}
.shot .top,.shot .demo{display:none}.shot{padding:8px!important}
.demo{max-width:420px;margin:14px auto 0;padding:10px 14px;border:1.5px dashed #c8935f;background:#fdf6ee;border-radius:12px;font-size:13px;color:#7a4d17;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo select{font:inherit;padding:4px 8px;border:1px solid #dcb587;border-radius:8px;background:#fff;color:#7a4d17}
.cmp .demo{display:none}
.stp input{cursor:pointer;caret-color:transparent}
.kp{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#e9eaee;padding:10px 10px 18px;box-shadow:0 -4px 14px rgba(0,0,0,.15);border-radius:18px 18px 0 0}
.kph{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 10px;font-size:15px;color:#555}
.kph b{font-size:24px;color:var(--ink);font-weight:600}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpg button{height:74px;border-radius:12px;background:#fff;font-size:30px;font-weight:500;color:#222;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.kpg button:active{background:#d9dce2}
.kpg button.bk{background:#d4d7dd;color:#333;display:flex;align-items:center;justify-content:center}
.kpg button.ok{background:var(--t);color:#fff;font-size:22px}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#323232;color:#fff;font-size:14px;padding:12px 18px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>

       r.items.map(function(x){return '<div class="l3i"><span>'+esc(x[0])+'</span><span>'+x[1].toFixed(1)+' × ৳'+x[2].toFixed(2)+'</span></div>'}).join('')+'</div></div>'}).join('')+'</div>'+

  if(S.pop==='iface')h+='<div class="ov" data-act="closepop"></div><div class="ifp"><h3>Interface Selection</h3><button class="x" data-act="closepop" aria-label="Close">'+I.x+'</button><p>Select one of the interface you prefer.</p><div class="ch"><button data-act="go" data-v="order"><img src="'+IMG.newui+'" alt="">New</button><button data-act="nyi"><img src="'+IMG.oldui+'" alt="">Old</button></div></div>';
  return h+'</div>';
};
V.history=function(){
  return sb(true)+'<div class="view m3"><div class="ab"><button class="ibx" data-act="go" data-v="outlets" aria-label="Back">'+I.backarr+'</button><h2>Order History</h2><button class="ibx" data-act="nyi" aria-label="Sort" style="color:#424242">'+I.sort+'</button></div>'+
   '<div class="chipr">'+['Purchase History','Pending','Accepted','ReadyToDispatch','Delivered'].map(function(t,i){return '<button class="'+(S.htab===i?'on':'')+'" data-act="htab" data-v="'+i+'">'+t+'</button>'}).join('')+'</div>'+
   '<div class="dtab">'+['7 days','15 days','30 days'].map(function(t,i){return (i?'<i></i>':'')+'<button class="'+(S.dtab===i?'on':'')+'" data-act="dtab" data-v="'+i+'">'+t+'</button>'}).join('')+'<i></i><span style="width:30px"></span></div>'+
   '<div class="scroll"><div class="hlist">'+(S.htab===0?HIST.map(function(r){return '<div class="hcd"><div class="hh"><img src="'+IMG.gift+'" alt="">Product: <b>'+r[0]+'</b></div><div class="rw"><div>SKU: <b>'+r[1]+'</b></div><i>|</i><div>Order QTY: <b>'+r[2]+'</b></div></div><div class="rw"><div>Deliver QTY: <b>'+r[3]+'</b></div><i>|</i><div>Bounce Rate: <b>'+r[4]+'</b></div></div></div>'}).join(''):'<div style="text-align:center;color:#9e9e9e;font-size:16px;padding-top:80px">No data found</div>')+'</div></div></div>';
};
function kpad(){var p=PRODS[S.kp],k=[['1','2','3'],['4','5','6'],['7','8','9'],['bk','0','ok']];
  return '<div class="kp"><div class="kph"><span>'+esc(p.n)+'</span><b>'+(S.qty[S.kp]||0)+'</b></div><div class="kpg">'+k.map(function(r){return r.map(function(x){return '<button data-act="kpk" data-v="'+x+'" class="'+(x==='ok'?'ok':x==='bk'?'bk':'')+'" aria-label="'+(x==='ok'?'Done':x==='bk'?'Backspace':x)+'">'+(x==='bk'?'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z" fill="currentColor"/></svg>':x==='ok'?'Done':x)+'</button>'}).join('')}).join('')+'</div></div>';}
V.order=function(){
  var o=OUT[S.checked>=0?S.checked:0],n=0;Object.keys(S.qty).forEach(function(k){if(S.qty[k]>0)n++});
  return sb(true,true)+'<div class="view"><div class="ohead"><button data-act="go" data-v="outlets" aria-label="Back">'+I.back+'</button><h2>'+esc(o.n)+'</h2><button data-act="nyi" aria-label="Search">'+I.search+'</button></div>'+
   '<div class="otb"><button data-act="nyi">'+I.tag+'Offers (1)</button><button data-act="nyi">'+I.grid+'Grid View</button><button data-act="nyi">'+I.filter+'Filter</button></div>'+
   '<div class="scroll" style="background:var(--m3)"><div class="plist">'+PRODS.map(function(p,i){var q=S.qty[i]||0;
    return '<div class="pc"><div class="t1"><img class="pim" src="'+IMG[p.img]+'" alt=""><div class="pi"><div class="pn">'+esc(p.n)+'</div><div class="lr"><span class="lot">Lot: '+esc(p.lot)+'</span><button class="stk" data-act="stk" data-v="'+i+'">Stock : '+p.stk+I.eye+'</button></div><div class="prr"><span class="pr">৳'+p.r.toFixed(2)+'</span><span class="lt">৳'+(q*p.r).toFixed(2)+'</span></div></div></div>'+
    '<div class="t2"><div class="stp"><button data-act="qstep" data-i="'+i+'" data-v="-1" aria-label="Decrease">'+I.minus+'</button><input id="qi'+i+'" readonly data-act="kp" data-i="'+i+'" value="'+q+'" inputmode="numeric" aria-label="Quantity"><button data-act="qstep" data-i="'+i+'" data-v="1" aria-label="Increase">'+I.plus2+'</button></div>'+[2,3].map(function(k){return '<button class="qc" data-act="qset" data-i="'+i+'" data-v="'+k+'">'+k+'</button>'}).join('')+'</div></div>'}).join('')+'</div></div>'+
   (S.kp!=null?'':'<button class="cfab" data-act="nyi" aria-label="Cart">'+I.cart+(n?'<span>'+n+'</span>':'')+'</button>')+(S.kp!=null?kpad():'')+'</div>';
};

/* ---------- render & actions ---------- */
var scr=$('#scr'),anim=null,timers=[];
function clearT(){timers.forEach(clearTimeout);timers=[];if(anim){anim.destroy();anim=null}}
function render(keep){var sc=scr.querySelector('.scroll'),st=sc?sc.scrollTop:0;scr.innerHTML=V[S.v]()+'<div class="toast" id="toast"></div>';if(keep){var n=scr.querySelector('.scroll');if(n)n.scrollTop=st}after();renderFlow()}
function after(){
  if(S.v==='sync'&&!anim){var el=$('#lot');if(window.lottie&&el){anim=lottie.loadAnimation({container:el,renderer:'svg',loop:false,autoplay:true,animationData:IMG.lottie});}
    timers.push(setTimeout(function(){var m=$('#smsg');if(m)m.textContent='Synchronization successfully completed!'},2200));
    timers.push(setTimeout(function(){if(S.v==='sync'){anim&&anim.destroy();anim=null;S.v='dayin';S.pop='hello';render()}},4200));}
  if(S.v==='dayin')wireSlide();
}
function go(v){clearT();S.v=v;S.pop=null;render()}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.className='toast on';clearTimeout(tt);tt=setTimeout(function(){t.className='toast'},2600)}
var A={
 go:function(e){go(e.dataset.v)},
 nyi:function(){toast('Not part of the screenshots')},
 terr:function(e){S.terr[e.dataset.v]=!S.terr[e.dataset.v];render(true)},
 closepop:function(){S.pop=null;render(true)},
 proceed:function(){S.pop=null;render()},
 checkin:function(e){var r=$('#cires').value;
   if(r==='net'){toast('No internet! Please check your connection.');return}
   if(r==='gps'){toast('You are not within GPS range.');return}
   S.checked=+e.dataset.v;S.pop='last3';render(true)},
 order:function(e){if(S.checked!==+e.dataset.v){S.checked=+e.dataset.v;}S.pop='iface';render(true)},
 otab:function(e){S.otab=+e.dataset.v;render(true)},
 htab:function(e){S.htab=+e.dataset.v;render(true)},
 dtab:function(e){S.dtab=+e.dataset.v;render(true)},
 qstep:function(e){var i=e.dataset.i;S.qty[i]=Math.max(0,(S.qty[i]||0)+(+e.dataset.v));render(true)},
 qset:function(e){var i=e.dataset.i;S.qty[i]=(S.qty[i]||0)+(+e.dataset.v);render(true)},
 kp:function(e){S.kp=+e.dataset.i;S.kpFresh=true;render(true);var sc=scr.querySelector('.scroll'),c=scr.querySelectorAll('.pc')[S.kp],k=scr.querySelector('.kp');if(sc&&c&&k){sc.scrollTop=Math.max(0,c.offsetTop-Math.max(8,(sc.clientHeight-k.offsetHeight-c.offsetHeight)/2))}},
 kpk:function(e){var v=e.dataset.v,i=S.kp,q=S.qty[i]||0;if(v==='ok'){S.kp=null}else if(v==='bk'){S.qty[i]=S.kpFresh?0:Math.floor(q/10);S.kpFresh=false}else{S.qty[i]=S.kpFresh?+v:Math.min(99999,q*10+(+v));S.kpFresh=false}render(true)},
 stk:function(){}
};
scr.addEventListener('click',function(ev){var el=ev.target.closest('[data-act]');
  /* tapping anywhere outside the keypad closes it (and still does what was tapped) */
  if(S.kp!=null&&!ev.target.closest('.kp')&&!(el&&el.dataset.act==='kp')){var fwd=el&&scr.contains(el)?{dataset:Object.assign({},el.dataset)}:null;S.kp=null;render(true);if(fwd&&A[fwd.dataset.act])A[fwd.dataset.act](fwd);return}
  if(!el||!scr.contains(el))return;var f=A[el.dataset.act];if(f)f(el)});
scr.addEventListener('scroll',function(ev){var t=ev.target;if(t.id==='pdfs'){var pg=t.querySelectorAll('.pg'),n=1;pg.forEach(function(x,i){if(x.offsetTop-t.scrollTop<t.clientHeight/2)n=i+1});var el=$('#pgno');if(el)el.textContent=n+' / '+pg.length}},true);
scr.addEventListener('input',function(ev){var t=ev.target;
  if(t.id==='q'){S.q=t.value;var p=t.selectionStart;render(true);var n=$('#q');n.focus();n.setSelectionRange(p,p)}
  else if(t.dataset.qi!=null){S.qty[t.dataset.qi]=parseInt(t.value.replace(/\D/g,'')||'0',10);var id=t.id;render(true);var m=$('#'+id);m.focus();var L=m.value.length;m.setSelectionRange(L,L)}});
function wireSlide(){var sl=$('#slide');if(!sl)return;var k=sl.querySelector('.kn'),d=null;
  k.addEventListener('pointerdown',function(ev){if(S.pop)return;d={x0:ev.clientX,max:sl.clientWidth-k.offsetWidth,dx:0,z:sl.getBoundingClientRect().width/sl.offsetWidth};k.setPointerCapture(ev.pointerId);sl.classList.add('drag')});
  k.addEventListener('pointermove',function(ev){if(!d)return;d.dx=Math.max(0,Math.min(d.max,(ev.clientX-d.x0)/d.z));k.style.transform='translateX('+d.dx+'px)'});
  function up(){if(!d)return;var ok=d.dx>=d.max*.85;sl.classList.remove('drag');d=null;if(ok){k.style.transform='translateX('+(sl.clientWidth-k.offsetWidth)+'px)';setTimeout(function(){go('pdf');toast('Day In successful')},250)}else k.style.transform=''}
  k.addEventListener('pointerup',up);k.addEventListener('pointercancel',up);}
setInterval(function(){var c=$('#clock');if(c&&S.v==='dayin'){var t=dayinBody().match(/id="clock">([^<]*)/);if(t)c.textContent=t[1]}},20000);

/* step buttons above the phone */
var STEPS=[['login','Login'],['sync','Synchronizing'],['dayin','Day In'],['home','Home'],['outlets','My Outlets'],['history','Order History'],['last3','Last 3 Orders'],['order','Order (New)']];
function renderFlow(){if(!$('#flow'))return;var cur=S.v==='outlets'&&S.pop==='last3'?'last3':S.v;$('#flow').innerHTML=STEPS.map(function(s,i){return '<button class="'+(s[0]===cur?'on':'')+'" data-step="'+s[0]+'">'+(i+1)+'. '+s[1]+'</button>'}).join('')}
if($('#flow'))$('#flow').addEventListener('click',function(ev){var b=ev.target.closest('[data-step]');if(!b)return;var v=b.dataset.step;clearT();
  if(v==='last3'){S.v='outlets';S.checked=0;S.pop='last3';render();return}
  if(v==='dayin'){S.v='dayin';S.pop='hello';render();return}
  if(v==='order'&&S.checked<0)S.checked=0;go(v)});
var HS=new URLSearchParams(location.hash.slice(1));
if(HS.get('go')){S.v=HS.get('go');S.pop=HS.get('pop')||null;if(HS.get('checked'))S.checked=+HS.get('checked');document.body.classList.add('shot');}
if(HS.get('v')){S.v=HS.get('v');S.pop=HS.get('pop')||null;if(HS.get('checked'))S.checked=+HS.get('checked');if(HS.get('qty'))S.qty={0:+HS.get('qty')};document.body.classList.add('cmp');
  if(HS.get('ref')){var im=document.createElement('img');im.src=HS.get('ref');im.className='ref';document.querySelector('.stage').appendChild(im);}
  if(HS.get('scroll'))setTimeout(function(){var sc=scr.querySelector('.scroll');if(sc)sc.scrollTop=+HS.get('scroll')},50);}
render();
window.__SR={S:function(){return S},A:A,go:go};
})();
