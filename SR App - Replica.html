<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokrio SR App Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600;1,700&family=Anek+Bangla:wght@400;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{--t:#1591a1;--t2:#2096a5;--g:#1aac7a;--bg:#fafafa;--m3:#fef7ff;--ink:#212121;--mut:#757575;--red:#f44336;--org:#fb6340}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e9edf0}
body{font-family:'Anek Bangla',system-ui,sans-serif;color:#1e2a44;padding-block:20px 40px;padding-inline:16px}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}
.top{max-width:980px;margin:0 auto 14px}
.top .eb{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--t);text-transform:uppercase}
.top h1{font-size:24px;font-weight:700;line-height:1.25}
.top p{font-size:13.5px;color:#5b6472;max-width:80ch;margin-top:4px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.flow button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid #d5dde3;color:#5b6472}
.flow button.on{background:var(--t);border-color:var(--t);color:#fff}
.stage{display:flex;justify-content:center}
.phone{position:relative;background:linear-gradient(145deg,#3a3d42,#17191c 40%,#2b2e33);border-radius:44px;padding:14px;box-shadow:0 0 0 2px #55595f,0 30px 60px -30px rgba(0,0,0,.6);zoom:.7397}
.phone::after{content:"";position:absolute;left:50%;top:30px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#050608;box-shadow:inset 0 0 0 3px #1c1f24;z-index:40}
@media (max-width:460px){.phone{zoom:.62}}
/* ---------- device (all sizes in screenshot pixels, 557 x 998) ---------- */
.scr{position:relative;width:557px;height:1237px;border-radius:30px;overflow:hidden;background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.sb{flex:0 0 40px;height:40px;padding-top:6px!important;display:flex;align-items:center;gap:7px;padding:0 6px;font:500 12px/1 Roboto,Poppins,sans-serif;color:#3b3b3b;z-index:3}
.sb svg{flex:0 0 auto}
.sb.dk{background:var(--t);color:#fff}.sb.dk svg{filter:brightness(0) invert(1)}.sb.dk b{color:#fff!important}.sb .gps{margin-left:auto}
.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.center{text-align:center}
/* login */
.lg{padding:20px 43px 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.lg h1{font-size:52px;font-weight:500;line-height:1;text-align:center;margin-top:12px;letter-spacing:-.5px}
.lg .sub{font-size:24px;color:var(--mut);text-align:center;margin-top:2px}
.lg .logo{display:block;width:52px;margin:30px auto 0}
.lg .brand{font-size:22px;font-weight:600;color:var(--t);text-align:center;letter-spacing:1px;margin-top:-4px}
.fl{font-size:23px;font-weight:500;margin-top:40px}
.fl+.box{margin-top:5px}
.lg .fl{margin-top:30px}
.lg .clogo{display:block;width:230px;margin:48px auto 0}
.lg .fl.f1{margin-top:70px}
.box{display:flex;align-items:center;height:82px;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.07);padding:0 9px}
.box input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--ink);height:100%}
.box input::placeholder{color:var(--mut)}
.box .eye{color:#9e9e9e;display:flex;padding-top:24px}
.forgot{display:block;margin:18px 0 0 auto;font-size:22px;color:#64b5e8}
.fpw{position:relative;width:76px;height:76px;margin:40px auto 0;border-radius:50%;border:1.5px solid #6cbcc6;display:flex;align-items:center;justify-content:center}
.fpw img{width:62px;opacity:.9}
.fpw .lk{position:absolute;left:-26px;top:22px;width:28px;height:28px}
.btnp{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:70px;border-radius:10px;background:var(--t);color:#fff;font-size:28px;font-weight:400;box-shadow:0 3px 6px rgba(0,0,0,.18)}
.btnp small{font-size:18px}
.lg .btnp{margin-top:60px}
/* today's plan / sync */
.m3{background:var(--m3)}
.tp{padding:0 44px}
.tp .logo{display:block;width:80px;margin:52px auto 0}
.tp h1{font-size:52px;font-weight:400;text-align:center;line-height:1.1;margin-top:36px}
.tp .sub{font-size:24px;color:var(--mut);text-align:center;margin-top:6px}
.tp .terr{font-size:28px;font-weight:600;color:var(--g);text-align:center;margin-top:18px}
.tp .amt{font-size:24px;font-weight:400;margin-top:22px}
.tlist{background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);height:353px;margin-top:4px;padding:30px 26px 0 27px}
.trow{display:flex;justify-content:space-between;align-items:center;height:44px;font-size:14px;width:100%;text-align:left}
.cb{width:15px;height:15px;border:1.6px solid #555;border-radius:2px;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--t);border-color:var(--t)}
.tp .btnp{margin:35px 0 0 7px;width:calc(100% - 14px)}
.netbar{flex:0 0 86px;display:flex;align-items:center;background:#fff;border-top:1px solid #eee;padding:0 30px}
.netbar>div{flex:1;display:flex;align-items:center;gap:15px}
.netbar>i{width:1px;height:46px;background:#e0e0e0;margin:0 24px}
.nic{width:62px;height:62px;border-radius:10px;background:#e8f6f1;display:flex;align-items:center;justify-content:center;color:var(--g)}
.netbar p span{display:block;font-size:14px;color:#9e9e9e;line-height:1.2}
.netbar p b{display:block;font-size:18px;font-weight:600;color:var(--g);line-height:1.3}
.sync h1{font-size:52px;font-weight:400;text-align:center;margin-top:142px;line-height:1.1}
.ring{width:362px;height:362px;border-radius:50%;border:3px solid var(--g);margin:34px auto 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring>div{width:330px;height:250px}
.sync .msg{font-size:12px;text-align:center;margin-top:62px;min-height:18px}
/* day in */
.dayin{background:#fff;position:relative}
.skip{position:absolute;right:14px;top:12px;height:25px;padding:0 10px;border:1px solid var(--t);border-radius:13px;color:var(--t);font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;z-index:2}
.dayin .logo{display:block;width:192px;margin:98px auto 0}
.dayin .brand{font-size:19px;font-weight:600;color:var(--t);text-align:center;margin-top:-8px;letter-spacing:.5px}
.dayin .ct{font-size:18px;color:var(--t);text-align:center;margin-top:330px}
.dayin .cv{font-size:16px;color:#424242;text-align:center;margin-top:6px}
.slide{position:absolute;left:20px;right:20px;bottom:22px;height:54px;border-radius:27px;background:#73bdc7;overflow:hidden;touch-action:none;user-select:none}
.slide .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5a5a5a;padding-left:40px}
.slide .txt b{font-weight:500;color:#2a2a2a;margin-left:4px}
.slide .kn{position:absolute;left:0;top:0;width:54px;height:54px;border-radius:50%;background:var(--t);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .25s;cursor:grab}
.slide.drag .kn{transition:none}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:center;justify-content:center}
.hello{position:absolute;left:125px;top:calc(50% - 272px);width:311px;height:544px;background:#fff5f5;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:0 16px;z-index:11}
.hello h3{font-size:20px;font-weight:700;color:var(--t);text-align:center;margin-top:16px}
.hello .x{position:absolute;right:18px;top:18px;color:#9e9e9e}
.hello .av{width:54px;height:54px;border-radius:50%;border:2px solid var(--t);margin:10px auto 0;overflow:hidden;padding:2px}
.hello .av img{width:100%;height:100%;border-radius:50%;display:block}
.hello .nm{font-size:14px;font-weight:700;font-style:italic;color:var(--t);text-align:center;margin-top:6px}
.hello .wb{background:#fff;border:1px solid #eee;border-radius:8px;height:154px;margin-top:16px;text-align:center;padding-top:12px}
.hello .wb small{display:block;font-size:10px;color:#9e9e9e}
.hello .wb b{font-size:15px;font-weight:700;color:#9e9e9e}
.hello .wb b span{font-weight:400;color:var(--ink)}
.hello .lr{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:#424242}
.hello .lr span{display:flex;align-items:center;gap:6px}
.hello .cl{background:#f5f5f5;border-radius:6px;padding:9px 10px;margin-top:10px;min-height:72px}
.hello .cl .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.hello .cl .h span{display:flex;align-items:center;gap:7px}
.hello .cl .h button{font-size:10px;font-weight:700;color:var(--t);display:flex;align-items:center;gap:3px}
.hello .cl p{font-size:11px;line-height:1.5;margin-top:6px;color:#424242}
.hello .go{position:absolute;left:68px;bottom:23px;width:174px;height:36px;border-radius:18px;background:var(--t);color:#fff;font-size:13px;font-weight:600}
/* app bars */
.ab{flex:0 0 48px;margin-top:-2px;display:flex;align-items:flex-start;justify-content:space-between;padding:0 16px 0 22px;position:relative;z-index:2}
.ab h2{position:absolute;left:90px;right:90px;top:0;line-height:44px;text-align:center;font-size:26px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx{width:58px;height:44px;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--t);position:relative}
.ibx .bdg{position:absolute;right:4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#ff5252;color:#fff;font:500 13px/20px Roboto,sans-serif;text-align:center;padding:0 4px;border:2px solid #fff}
.abt{background:var(--t);border-radius:0 0 0 0}
.abt h2{color:#fff;font-weight:600}
.abt .ibx{background:rgba(255,255,255,.12);box-shadow:none;color:#fff}
/* home */
.home{padding:8px 25px 140px 31px}
.banner{display:block;width:501px;height:153px;object-fit:fill;border-radius:2px}
.hc2{display:grid;grid-template-columns:238px 238px;gap:19px;margin:26px 0 0 3px}
.hc2.one{grid-template-columns:495px;margin-top:6px}
.hcard.big i{right:16px;top:16px;width:64px;height:64px}
.hcard.big i img{width:44px}
.hcard{position:relative;height:176px;border-radius:8px;padding:72px 22px 0 16px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.1);background:#fff}
.hcard.t{background:var(--t);color:#fff}
.hcard b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.hcard span{display:block;font-size:18px;line-height:1.45;color:#9e9e9e}
.hcard.t span{color:#fff}
.hcard i{position:absolute;right:11px;top:11px;width:36px;height:36px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.hcard i img{width:24px}
.grid{display:grid;grid-template-columns:repeat(3,153px);column-gap:18px;row-gap:15px;margin:37px 0 0 3px}
.tile{height:135px;border-radius:8px;background:var(--m3);box-shadow:0 2px 5px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:21px;font-weight:500;line-height:1.45;text-align:center;color:var(--ink)}
.tile img{width:40px;height:40px;object-fit:contain}
.bnav{position:absolute;left:8px;right:8px;bottom:8px;height:92px;border-radius:44px;background:var(--m3);box-shadow:0 -2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-around;padding:0 40px;z-index:4}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--t);min-width:60px}
.bnav img{width:32px;height:32px}
/* my outlets */
.srch{display:flex;align-items:center;height:52px;margin:7px 25px 0 31px;background:#fff;border-radius:8px;padding:0 14px 0 15px}
.srch input{flex:1;border:none;outline:none;font-size:24px;color:var(--ink);background:none}
.srch input::placeholder{color:#9e9e9e}
.srch svg{color:#9e9e9e}
.route-picker{display:flex;align-items:center;gap:10px;margin:13px 25px 0 31px;min-width:0}
.route-label{font-size:14px;font-weight:600;color:#666;flex-shrink:0}
.route-tabs{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:1;padding:3px 0 6px;scrollbar-width:thin}
.route-tabs button{flex-shrink:0;white-space:nowrap;padding:8px 12px;border:1px solid #d6dedb;border-radius:18px;background:#fff;font-size:14px;color:#555}
.route-tabs button.on{background:var(--t);border-color:var(--t);color:#fff;font-weight:600}
.route-tabs button:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.route-picker+.otabs{margin-top:10px}
.otabs{display:flex;height:38px;margin:20px 25px 0 31px;background:#fff;border-radius:4px}
.otabs button{flex:1;font-size:18px;font-weight:500;color:var(--ink);border-radius:4px}
.otabs button.on{background:var(--t);color:#fff}
.ab.outlets-header{align-items:center}
.ab.outlets-header h2{position:static;flex:1;min-width:0;text-align:left;margin-left:12px;line-height:44px}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-width:62px;min-height:44px;margin-right:8px;padding:6px 9px;color:var(--t);border-radius:7px;font-size:16px;font-weight:600}
.upload-btn:disabled{opacity:.65;cursor:wait}
.upload-count{background:var(--t);color:#fff;border-radius:12px;min-width:22px;padding:2px 5px;text-align:center}
.upload-btn[aria-busy="true"] svg{animation:upload-pulse .8s ease-in-out infinite alternate}
@keyframes upload-pulse{to{opacity:.3;transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.upload-btn[aria-busy="true"] svg{animation:none}}
.upload-status{margin:9px 26px 0 31px;font-size:14px;color:#555;line-height:1.4}
.upload-status:empty{display:none}
.upload-status.error{color:#b3261e}
.upload-status.success{color:#16704c}
.cnts{margin-top:18px}
.outlet-filters{margin:10px 26px 4px 31px;padding:14px;background:#fff;border:1px solid #ddd;border-radius:10px}
.outlet-filters label{display:block;margin-bottom:10px;font-size:14px;font-weight:500}
.outlet-filters select{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:var(--ink);font:inherit}
.outlet-filters select:focus{outline:2px solid var(--t);outline-offset:1px}
.outlet-filter-footer{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#666}
.outlet-filter-footer button{padding:7px;color:var(--t);font:inherit;font-weight:600}
.outlet-filter-button.active{color:var(--t);background:#e3f3ef;border-radius:8px}
.outlet-empty{padding:30px 16px;text-align:center;color:#666;font-size:17px}
.cnts{display:flex;justify-content:space-between;margin:38px 26px 0 31px;font-size:23px;color:#424242}
.olist{padding:20px 27px 80px 34px;display:flex;flex-direction:column;gap:17px}
.oc{background:#fdfdfd;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.14);padding:15px 18px 17px}
.oc.ci{background:#ead196}
.oc .top2{display:flex;gap:16px}
.oc .outlet-photo{position:relative;width:128px;height:117px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:#ddd}
.oc .ph{display:block;width:100%;height:100%;object-fit:cover}
.oc .photo-distance{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;background:rgba(0,0,0,.72);color:#fff;font-size:15px;font-weight:500;white-space:nowrap}
.oc .photo-distance svg{flex-shrink:0;width:15px;height:15px}
.oc .inf{flex:1;min-width:0;position:relative}
.oc .nmr{display:flex;align-items:flex-start;gap:6px}
.oc .nmr b{flex:1;min-width:0;font-size:24px;font-weight:600;line-height:1.43;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc.ci .nmr b{color:#111}
.oc .activity-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:15px;color:#7b7b7b;line-height:1.7}
.oc .activity-row>div{white-space:nowrap;min-width:0}
.oc .activity-row>div:last-child{text-align:right}
.oc .activity-row b{font-weight:500;color:#616161}
.oc .activity-row .ordered-value{color:var(--org)}
.oc .kv{font-size:16px;color:#7b7b7b;line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:clip}
.oc .kv b{font-weight:500;color:#616161}
.oc .kv .tl{color:var(--t);font-weight:400}
.oc .kv .rd{color:var(--org);font-weight:500;font-size:17px}
.oc hr{border:none;border-top:1px solid #4e9fa9;margin:8px 0 10px}
.oc .acts{display:flex;justify-content:space-between;padding:0 20px}
.oc .acts button{width:120px;height:30px;background:#f5f5f5;border:1px solid #dcdcdc;border-radius:2px;font-size:16px;color:var(--ink)}
.fab{position:absolute;right:18px;bottom:22px;width:48px;height:48px;border-radius:50%;background:#ff6b6b;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:4}
/* interface popup */
.ifp{position:absolute;left:33px;top:calc(50% - 130px);width:498px;height:261px;background:#fff;border-radius:16px;z-index:11;text-align:center}
.ifp h3{font-size:15px;font-weight:500;color:var(--t);margin-top:18px}
.ifp .x{position:absolute;right:18px;top:18px;color:#9e9e9e}
.ifp p{font-size:13px;margin-top:14px}
.ifp .ch{display:flex;justify-content:center;gap:57px;margin-top:3px}
.ifp .ch button{width:145px;height:168px;background:#e6f3f4;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
.ifp .ch img{width:112px;height:112px}
/* last 3 orders after check-in */
.l3{position:absolute;left:33px;right:33px;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;z-index:11;padding:18px 18px 20px}
.l3h{display:flex;align-items:center;gap:12px}
.l3h .ok{width:38px;height:38px;border-radius:50%;background:#1aac7a;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.l3h b{display:block;font-size:17px;font-weight:600;color:var(--t);line-height:1.2}
.l3h small{display:block;font-size:13px;color:#757575}
.l3h .x{margin-left:auto;align-self:flex-start;color:#9e9e9e}
.l3t{font-size:15px;font-weight:600;margin:16px 0 8px}
.l3l{display:flex;flex-direction:column;gap:10px}
.l3c{border-radius:8px;overflow:hidden;background:var(--m3);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.l3c .hh{height:38px;background:var(--t);color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;font-weight:500}
.l3c .hh img{width:16px;filter:brightness(10)}
.l3c .st{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fff}
.l3c .st.g{color:#1aac7a}.l3c .st.o{color:#f57c00}.l3c .st.r{color:#e53935}
.l3b{padding:6px 14px 8px}
.l3r{display:flex;justify-content:space-between;font-size:12px;color:#8a8a8a;padding:3px 0 5px;border-bottom:1px solid #e5dde6;margin-bottom:3px}
.l3r b{font-weight:500;color:#333}
.l3i{display:flex;justify-content:space-between;font-size:13px;color:#424242;padding:2px 0}
.l3i span:last-child{color:#616161}
.btnp.l3n{height:54px;font-size:22px;margin-top:16px}
.ocg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

scr.addEventListener('click',function(ev){var el=ev.target.closest('[data-act]');
  /* tapping anywhere outside the keypad closes it (and still does what was tapped) */
  if(S.kp!=null&&!ev.target.closest('.kp')&&!(el&&el.dataset.act==='kp')){var fwd=el&&scr.contains(el)?{dataset:Object.assign({},el.dataset)}:null;S.kp=null;render(true);if(fwd&&A[fwd.dataset.act])A[fwd.dataset.act](fwd);return}
  if(S.v==='addout'&&S.ao.menu&&!ev.target.closest('.afm')&&!(el&&el.dataset.act==='aomenu')){S.ao.menu=null;render(true);return}
  if(!el||!scr.contains(el))return;var f=A[el.dataset.act];if(f)f(el)});

  if(t.id==='q'){S.q=t.value;var p=t.selectionStart;render(true);var n=$('#q');n.focus();n.setSelectionRange(p,p)}
  else if(t.dataset.qi!=null){S.qty[t.dataset.qi]=parseInt(t.value.replace(/\D/g,'')||'0',10);var id=t.id;render(true);var m=$('#'+id);m.focus();var L=m.value.length;m.setSelectionRange(L,L)}});
function wireSlide(){var sl=$('#slide');if(!sl)return;var k=sl.querySelector('.kn'),d=null;
  k.addEventListener('pointerdown',function(ev){if(S.pop)return;d={x0:ev.clientX,max:sl.clientWidth-k.offsetWidth,dx:0,z:sl.getBoundingClientRect().width/sl.offsetWidth};k.setPointerCapture(ev.pointerId);sl.classList.add('drag')});
  k.addEventListener('pointermove',function(ev){if(!d)return;d.dx=Math.max(0,Math.min(d.max,(ev.clientX-d.x0)/d.z));k.style.transform='translateX('+d.dx+'px)'});
  function up(){if(!d)return;var ok=d.dx>=d.max*.85;sl.classList.remove('drag');d=null;if(ok){k.style.transform='translateX('+(sl.clientWidth-k.offsetWidth)+'px)';if(S.v==='act'){setTimeout(function(){S.logOn=S.logOn===false;render();toast(S.logOn?'Logging enabled':'Logging disabled')},250);return}setTimeout(function(){S.dayIn=true;go('pdf');toast('Day In successful')},250)}else k.style.transform=''}
  k.addEventListener('pointerup',up);k.addEventListener('pointercancel',up);}
