<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #ffffff;
  --topbar: #eceef6;
  --panel: #f3f4f8;
  --panel-head: #f3f4f8;
  --border: #e3e5ee;
  --row-border: #e6e8ef;
  --text: #1f2330;
  --text-2: #3b4050;
  --muted: #8a90a2;
  --accent: #7c5cf0;
  --accent-soft: #ece7ff;
  --link: #5b6fb3;
  --danger: #e5252a;
  --check: #1f2330;
  --phone-frame: #0b0b0d;
  --phone-bg: #ffffff;
  --skeleton: #dcdcdc;
  --sidebar-w: 160px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161d; --topbar:#1b1e28; --panel:#1d202b; --panel-head:#1d202b; --border:#2c3040; --row-border:#2a2e3c;
    --text:#e8eaf2; --text-2:#c5c9d6; --muted:#8990a6; --accent:#9d85ff; --accent-soft:#2c2650; --link:#8ea3ea;
    --check:#e8eaf2; --phone-frame:#000; --phone-bg:#101218; --skeleton:#2c2f3a;
  }
}
:root[data-theme="dark"]{
  --bg:#14161d; --topbar:#1b1e28; --panel:#1d202b; --panel-head:#1d202b; --border:#2c3040; --row-border:#2a2e3c;
  --text:#e8eaf2; --text-2:#c5c9d6; --muted:#8990a6; --accent:#9d85ff; --accent-soft:#2c2650; --link:#8ea3ea;
  --check:#e8eaf2; --phone-frame:#000; --phone-bg:#101218; --skeleton:#2c2f3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}

.sidebar .logo{height:64px;display:flex;align-items:center;justify-content:center;flex:none}
.sidebar .logo img{width:62px;height:33px;object-fit:cover;border-radius:2px}
.nav{flex:1;overflow-y:auto;padding:0 0 16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
.nav a{display:flex;align-items:center;gap:7px;height:40px;padding:0 8px 0 9px;color:#fff;text-decoration:none;font-size:9.5px;font-weight:600;letter-spacing:-.1px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a svg.ic{width:15px;height:15px;flex:none;opacity:.95}
.nav a .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav a .chev{width:11px;height:11px;flex:none;transition:transform .2s}
.nav .group.open > a .chev{transform:rotate(90deg)}
.nav .sub{display:none}
.nav .group.open .sub{display:block}
.nav .sub a{height:27px;padding-left:24px;font-size:9px;gap:9px}
.nav .sub a::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;flex:none}
.nav .sub a.active{background:rgba(255,255,255,.22)}

/* ---------- Main ---------- */
.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin .25s ease;display:flex;flex-direction:column}
body.collapsed .sidebar{transform:translateX(-100%)}
body.collapsed .main{margin-left:0}
.topbar{height:64px;background:var(--topbar);display:flex;align-items:center;padding:0 20px;gap:8px;position:sticky;top:0;z-index:20}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--text-2)}
.icon-btn:hover{background:rgba(124,92,240,.1)}
.icon-btn svg{width:20px;height:20px}
.topbar .spacer{flex:1}
.account{display:flex;align-items:center;gap:8px;margin:0 12px 0 10px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:14px;color:var(--text-2);letter-spacing:.2px;white-space:nowrap}
.account img{width:32px;height:32px;border-radius:50%;object-fit:cover}

.content{padding:22px 20px 40px 18px;flex:1}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}

/* policy tabs + filters */
.policy{background:var(--bg);border:1px solid var(--border);border-radius:4px;margin-bottom:16px}
.policy-top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:0 10px 0 0}
.tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
.tab{position:relative;flex:none;padding:15px 16px 14px;font-size:13px;color:var(--text);white-space:nowrap}
.tab:hover{color:var(--accent)}
.tab.active{color:var(--accent);font-weight:500}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab.draft:not(.active){color:var(--muted);font-style:italic}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.policy-actions{display:flex;align-items:center;gap:8px;flex:none}
.btn-outline{height:29px;padding:0 9px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);font-size:12px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn-outline:hover{background:var(--accent-soft)}
.btn-outline:focus-visible,.btn-del:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-del{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#fde6e6;color:#e5484d;transition:background .15s}
.btn-del:hover{background:#fbd0d0}
.btn-del:disabled{opacity:.4;cursor:not-allowed}
.btn-del svg{width:14px;height:14px}
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;padding:16px 12px 14px}
.role-field{display:flex;flex-direction:column;gap:8px;width:312px;max-width:100%}
.role-field label{font-size:12px;font-weight:700;color:var(--text)}
.role-field[hidden]{display:none}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;width:100%;height:32px;padding:0 32px 0 11px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
.select select.is-placeholder{color:var(--muted)}
.select select:disabled{cursor:not-allowed;opacity:.6}
.select select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.select svg{position:absolute;right:10px;top:50%;width:13px;height:13px;transform:translateY(-50%);pointer-events:none;color:var(--text-2)}
.select option{color:var(--text)}
.grid-wrap{position:relative}
.grid-wrap.locked .grid{opacity:.45;pointer-events:none;filter:grayscale(.3);user-select:none}
.lock-note{display:none;position:absolute;left:50%;top:90px;transform:translateX(-50%);z-index:4;background:var(--bg);border:1px solid var(--border);box-shadow:0 8px 24px rgba(30,20,80,.12);border-radius:6px;padding:12px 16px;font-size:12.5px;color:var(--text-2);align-items:center;gap:8px;white-space:nowrap}
.lock-note svg{width:16px;height:16px;color:var(--accent);flex:none}
.grid-wrap.locked .lock-note{display:flex}
.page-head h1{margin:0;font-size:17px;font-weight:700}
.crumb{display:flex;align-items:center;gap:10px;font-size:13px}
.crumb a{color:var(--link);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb .sep{color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 360px;gap:16px;align-items:start}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px}
.panel-h{height:50px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel-head)}
.panel-h::before{content:"";width:3px;height:16px;background:var(--accent);border-radius:2px}
.panel-h h2{margin:0;font-size:14px;font-weight:700;flex:1}
.panel-h .count{font-size:11px;color:var(--muted);font-weight:500}
.panel-b{padding:16px 0 14px}

.row{min-height:32px;padding:5px 0;display:flex;align-items:center;gap:10px;margin:0 12px;border-bottom:1px solid var(--row-border);font-size:12px;color:var(--text-2)}
.row:last-child{border-bottom:0}
label.row{cursor:pointer;user-select:none}
label.row:hover{color:var(--text)}
.row.head{font-weight:700;color:var(--text)}

/* custom checkbox */
.cb{appearance:none;-webkit-appearance:none;margin:0 2px 0 2px;width:13px;height:13px;border:1.5px solid var(--check);border-radius:2px;display:grid;place-items:center;cursor:pointer;flex:none;background:transparent}
.cb::after{content:"";width:7px;height:4px;border-left:1.8px solid var(--bg);border-bottom:1.8px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.cb:checked,.cb:indeterminate{background:var(--check)}
.cb:checked::after{opacity:1}
.cb:indeterminate::after{opacity:1;border-left:0;transform:none;width:7px;height:0;border-bottom:1.8px solid var(--bg)}
.cb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* selected list */
.sel-list{list-style:none;margin:0;padding:0;position:relative}
.sel-list li{position:relative;touch-action:none;background:var(--panel)}
.sel-list li .row{gap:8px}
.handle{width:22px;height:24px;display:grid;place-items:center;color:var(--muted);cursor:grab;border-radius:4px;margin-left:-4px;flex:none}
.handle:hover{color:var(--text-2);background:rgba(124,92,240,.08)}
.handle:focus-visible{outline:2px solid var(--accent)}
.handle svg{width:12px;height:12px}
.sel-list .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-list .idx{font-size:10px;color:var(--muted);width:16px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.remove{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex:none}
.remove svg{width:14px;height:14px}
.remove:hover{background:rgba(229,37,42,.1)}
.remove:focus-visible{outline:2px solid var(--danger)}
.sel-list li.dragging{z-index:5;box-shadow:0 8px 20px rgba(30,20,80,.18);border-radius:4px;opacity:.97}
.sel-list li.dragging .row{border-bottom-color:transparent}
.sel-list li.dragging .handle{cursor:grabbing}
.sel-list li.placeholder{background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:4px;margin:0 12px}
body.is-dragging, body.is-dragging *{cursor:grabbing !important;user-select:none}
.hint{font-size:11px;color:var(--muted);white-space:nowrap}
.btn-primary{display:inline-flex;align-items:center;gap:7px;height:29px;padding:0 14px;border-radius:4px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;transition:background .15s,opacity .15s}
.btn-primary svg{width:15px;height:15px}
.btn-primary:hover:not(:disabled){background:#6a48e8}
.btn-primary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:12px}

/* phone */
.phone-wrap{display:flex;justify-content:center}
.phone{width:360px;height:800px;border:6px solid var(--phone-frame);border-radius:40px;background:var(--phone-bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:4px 14px 0 12px;font-family:system-ui,sans-serif;font-size:14px;color:var(--text);flex:none}
.status .notch{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:40px;height:4px;border-radius:3px;background:#555}
.status .sys{display:flex;align-items:center;gap:5px}
.status .sys svg{height:12px;width:auto}
.app-bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px 16px;border-bottom:1px solid var(--row-border);border-radius:0 0 18px 18px;box-shadow:0 1px 0 var(--row-border);flex:none}
.sk{background:var(--skeleton);border-radius:1px}
.ph-body{padding:12px 10px 0;flex:1;overflow-y:auto;scrollbar-width:thin}
.ph-list{margin-top:44px;padding:0 8px}
.ph-row{display:flex;justify-content:space-between;align-items:center;gap:10px;height:26px;border-bottom:1px dashed #bfc3cc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;color:var(--text)}
.ph-row span:last-child{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ph-row.flash{animation:flash .6s ease}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.ph-empty{color:var(--muted);text-align:center;font-size:11px;padding:30px 0}
/* phone preview: the SR / Manager App card dashboard (the app is light even when this page is dark) */
.phone .status{background:#1591a1;color:#fff}
.phone .status .notch{background:rgba(255,255,255,.5)}
.mh{flex:none;background:#1591a1;color:#fff;border-radius:0 0 14px 14px;padding:2px 12px 12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.16);position:relative;z-index:2}
.mh-tp{display:flex;justify-content:space-between;align-items:center;height:24px}
.mh-tp svg{width:18px;height:18px}
.mh-pr{display:flex;align-items:center;gap:10px;margin-top:8px}
.mh-av{flex:0 0 46px;height:46px;border-radius:50%;background:rgba(255,255,255,.35)}
.mh-nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.mh-sk{display:block;height:11px;max-width:100%;border-radius:3px;background:rgba(255,255,255,.35)}
.mh-nm b{font:600 13px Poppins,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-nm span{font:400 11px Poppins,system-ui,sans-serif;opacity:.92}
.mh-sy{display:flex;align-items:center;gap:4px;font:500 12px Poppins,system-ui,sans-serif;align-self:flex-start;padding-top:2px}
.mh-sy svg{width:14px;height:14px}
.phone .ph-body{background:#f2f6f7;padding:10px 8px 14px;display:flex;flex-direction:column;gap:8px}
.mper{display:flex;gap:3px;background:#fff;border-radius:9px;padding:3px;box-shadow:0 1px 2px rgba(16,60,70,.08)}
.mper span{flex:1;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:500 11px Poppins,system-ui,sans-serif;color:#4c6a70}
.mper span.on{background:#1591a1;color:#fff}
.mper .mcal{flex:0 0 34px;color:#1591a1}
.mper .mcal svg{width:15px;height:15px}
.msr{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #d6e6e9;border-radius:9px;padding:6px 9px}
.msr[hidden]{display:none}
.msr-i{flex:0 0 28px;height:28px;border-radius:50%;background:#1591a1;color:#fff;display:flex;align-items:center;justify-content:center}
.msr-i svg{width:15px;height:15px}
.msr-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.msr-t small{font:400 8.5px Poppins,system-ui,sans-serif;color:#8a9a9d}
.msr-t b{font:600 11.5px Poppins,system-ui,sans-serif;color:#16343a}
.msr-t em{font-style:normal;font-weight:500;color:#1591a1;margin-left:3px}
.msr-c{width:15px;height:15px;color:#7a8a8d}
.mgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px}
.mc{position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:3px;background:var(--kb);border-radius:9px;padding:7px 8px 8px;box-shadow:0 1px 2px rgba(16,60,70,.08)}
.mc.tl{--kb:#e3f5f9;--kf:#0e8ba0;--kv:#0a6676}.mc.gr{--kb:#e6f6e9;--kf:#2e9d48;--kv:#1d7333}
.mc.or{--kb:#fff1dc;--kf:#e08a00;--kv:#a96400}.mc.pu{--kb:#eee9fb;--kf:#7150c9;--kv:#53379f}
.mc .mwm{position:absolute;right:-7px;bottom:-8px;display:flex;color:var(--kf);opacity:.11;pointer-events:none;font-style:normal}
.mch{position:relative;display:flex;align-items:flex-start;gap:5px}
.mch i{flex:0 0 17px;height:17px;border-radius:5px;background:#fff;color:var(--kf);display:flex;align-items:center;justify-content:center;font-style:normal}
.mch span{min-width:0;font:600 8px/1.2 Poppins,system-ui,sans-serif;letter-spacing:.15px;text-transform:uppercase;color:var(--kf);padding-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc b{position:relative;font:700 16px/1.2 Poppins,system-ui,sans-serif;color:var(--kv);font-variant-numeric:tabular-nums}
.mc.ok b{color:#1b9a5a}.mc.mid b{color:#d07a00}.mc.low b{color:#e5484d}
.mpr{position:relative;display:flex;align-items:center;gap:5px;margin-top:auto}
.mbar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.85);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--kf)}
.mc small{flex:0 0 auto;font:400 7.5px Poppins,system-ui,sans-serif;color:#5f7377;white-space:nowrap}
.mc.flash{animation:mflash .7s ease}
@keyframes mflash{from{box-shadow:0 0 0 2px var(--kf)}to{box-shadow:0 1px 2px rgba(16,60,70,.08)}}
@media (prefers-reduced-motion:reduce){.mc.flash{animation:none}}
.phone .ph-empty{grid-column:1/-1;color:#7a8a8d}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#1f2330;color:#fff;padding:9px 14px;border-radius:6px;font-size:12px;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

.scrim{display:none}
@media (max-width:1180px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .phone-wrap{grid-column:1 / -1}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-100%)}
  .main{margin-left:0}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .grid{grid-template-columns:minmax(0,1fr)}
  .content{padding:18px 16px 32px}
  .policy-top{flex-wrap:wrap;padding:0 0 10px}
  .tabs{flex-basis:100%}
  .policy-actions{margin-left:12px;flex-wrap:wrap;justify-content:flex-end}
  .hint{white-space:normal;flex-basis:100%;text-align:right}
  .role-field{width:100%}
  .lock-note{white-space:normal;width:calc(100% - 32px);top:40px}
  .topbar{padding:0 10px}
  .account span{display:none}
  .phone{width:min(360px,100%);height:680px}
}
</style>
</head>

    chk:"M14 10H2v2h12v-2zm0-4H2v2h12V6zM2 16h8v-2H2v2zm19.5-4.5L23 13l-6.99 7-4.51-4.5L13 14l3.01 3 5.49-5.5z",
    pin:"M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
    event:"M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z",
    cross:"M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z",
    star:"M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z",
    bars:"M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z",
    pie:"M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z",
    talk:"M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1L8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1zM19 12h2c0-4.97-4.03-9-9-9v2c3.87 0 7 3.13 7 7zm-4 0h2c0-2.76-2.24-5-5-5v2c1.66 0 3 1.34 3 3z",
    truck:"M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"
  };
  const picon = (k,sz)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${PIC[k]}"/></svg>`;
  const TONES = ["tl","or","pu","gr"];   // by position: a card never touches its own colour beside, above or below
  // the preview's profile is a placeholder; only the SR picker depends on the role (an SR sees their own dashboard)
  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const $ = id => document.getElementById(id);
  const kpiList = $("kpiList"), selList = $("selList"), phList = $("phList"), allCb = $("allCb");

  const ICON_DRAG = '<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="4" cy="2" r="1.1"/><circle cx="8" cy="2" r="1.1"/><circle cx="4" cy="6" r="1.1"/><circle cx="8" cy="6" r="1.1"/><circle cx="4" cy="10" r="1.1"/><circle cx="8" cy="10" r="1.1"/></svg>';
  const ICON_X = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#e5252a"/><path d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';

  // ---------- Render ----------
  function renderChecks(){
    kpiList.innerHTML = KPIS.map(k=>
      `<label class="row"><input type="checkbox" class="cb" data-id="${k.id}" ${selected.includes(k.id)?"checked":""}> ${esc(k.name)}</label>`
    ).join("");
    syncMaster();
  }
  function syncMaster(){
    const n = selected.length;
    allCb.checked = n === KPIS.length;
    allCb.indeterminate = n>0 && n<KPIS.length;
  }
  function renderSelected(){
    $("selCount").textContent = selected.length ? `${selected.length} of ${KPIS.length}` : "";
    if(!selected.length){
      selList.innerHTML = '<li class="empty">No header selected. Tick headers from the Dashboard Header list.</li>';
      return;
    }
    selList.innerHTML = selected.map((id,i)=>{
      const k = byId[id];
      return `<li data-id="${id}"><div class="row">
        <span class="handle" tabindex="0" role="button" aria-label="Reorder ${esc(k.name)} (use arrow keys)">${ICON_DRAG}</span>
        <span class="name">${esc(k.name)}</span>
        <button class="remove" data-remove="${id}" aria-label="Remove ${esc(k.name)}">${ICON_X}</button>
      </div></li>`;
    }).join("");
  }
  function renderPhone(flashId){
    const r = role() || "Sales Representative";
    $("phSr").hidden = r==="Sales Representative";
    if(!selected.length){ phList.innerHTML = '<div class="ph-empty">No header selected</div>'; return; }
    phList.innerHTML = selected.map((id,i)=>{
      const k = byId[id], bar = k.bar ? `<div class="mpr"><div class="mbar"><i style="width:${Math.min(100,k.bar[0])}%"></i></div><small>${k.bar[0]}% ${esc(k.bar[1])}</small></div>` : "";
      return `<div class="mc ${TONES[(Math.floor(i/2)%2)*2+i%2]}${k.tone?" "+k.tone:""}${id===flashId?" flash":""}"><i class="mwm">${picon(k.ic,52)}</i>`+
        `<div class="mch"><i>${picon(k.ic,11)}</i><span>${esc(k.name)}</span></div><b>${esc(k.v)}</b>${bar}</div>`;
    }).join("");
  }
  function renderAll(flashId){ renderChecks(); renderSelected(); renderPhone(flashId); markDirty(); }

  // ---------- Events ----------
  kpiList.addEventListener("change", e=>{
    const id = e.target.dataset.id; if(!id) return;
    if(e.target.checked){ if(!selected.includes(id)) selected.push(id); }
    else selected = selected.filter(x=>x!==id);
    syncMaster(); renderSelected(); renderPhone(e.target.checked?id:null); markDirty();
  });
  allCb.addEventListener("change", ()=>{
    if(allCb.checked){ KPIS.forEach(k=>{ if(!selected.includes(k.id)) selected.push(k.id); }); }
    else selected = [];
    renderAll();
  });
  selList.addEventListener("click", e=>{
    const b = e.target.closest("[data-remove]"); if(!b) return;
    const id = b.dataset.remove;
    selected = selected.filter(x=>x!==id);
    renderAll();
    toast(`${byId[id].name} removed`);
  });

  // keyboard reorder on handle
  selList.addEventListener("keydown", e=>{
    const h = e.target.closest(".handle"); if(!h) return;
    const id = h.closest("li").dataset.id, i = selected.indexOf(id);
    let j = i;
    if(e.key==="ArrowUp") j = i-1; else if(e.key==="ArrowDown") j = i+1; else return;
    e.preventDefault();
    if(j<0||j>=selected.length) return;
    selected.splice(i,1); selected.splice(j,0,id);
    renderSelected(); renderPhone(); markDirty();
    selList.querySelector(`li[data-id="${id}"] .handle`).focus();
  });

  // pointer drag reorder
  let drag = null;
  selList.addEventListener("pointerdown", e=>{
    const h = e.target.closest(".handle"); if(!h || e.button>0) return;
    e.preventDefault();
    const li = h.closest("li"), r = li.getBoundingClientRect(), pr = selList.getBoundingClientRect();
    const ph = document.createElement("li");
    ph.className = "placeholder"; ph.style.height = r.height+"px";
    li.after(ph);
    li.classList.add("dragging");
    Object.assign(li.style,{position:"absolute",left:"0",right:"0",top:(r.top-pr.top)+"px"});
    drag = {li, ph, offset:e.clientY - r.top, pointerId:e.pointerId};
    h.setPointerCapture(e.pointerId);
    document.body.classList.add("is-dragging");
  });
  selList.addEventListener("pointermove", e=>{
    if(!drag || e.pointerId!==drag.pointerId) return;
    const pr = selList.getBoundingClientRect();
    let top = e.clientY - pr.top - drag.offset;
    top = Math.max(-8, Math.min(top, pr.height - drag.li.offsetHeight + 8));
    drag.li.style.top = top+"px";
    const mid = e.clientY;
    const items = [...selList.children].filter(n=>n!==drag.li && n!==drag.ph);
    let before = null;
    for(const n of items){ const b = n.getBoundingClientRect(); if(mid < b.top + b.height/2){ before = n; break; } }
    if(before) selList.insertBefore(drag.ph, before); else selList.appendChild(drag.ph);
  });
  const endDrag = e=>{
    if(!drag || e.pointerId!==drag.pointerId) return;
    const id = drag.li.dataset.id;
    drag.ph.replaceWith(drag.li);
    selected = [...selList.children].map(n=>n.dataset.id).filter(Boolean);
    drag = null;
    document.body.classList.remove("is-dragging");
    renderSelected(); renderPhone(id); markDirty();
  };
  selList.addEventListener("pointerup", endDrag);
  selList.addEventListener("pointercancel", endDrag);

  // ---------- Sidebar ----------
  const IC = {
    home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',
    finger:'<path d="M12 11v3a8 8 0 0 1-2 5M8 11a4 4 0 0 1 8 0v2M5 9a7 7 0 0 1 14 0v4M16 17a13 13 0 0 1-1 4M8 15a8 8 0 0 1-1 3"/>',
    tree:'<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>',
    store:'<path d="M3 9l1.5-5h15L21 9M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 13v8h14v-8"/>',
    box:'<path d="M21 8l-9-5-9 5 9 5zM3 8v8l9 5 9-5V8M12 13v8"/>',
    pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/>',
    clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>',
    receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/>',
    card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',
    user:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 12-5M16 17l2 2 4-4"/>',
    bars:'<path d="M4 20V10M9 20V4M14 20v-8M19 20V7M2 20h20"/>',
    file:'<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>',
    wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
    bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
    cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
    claim:'<path d="M4 4h16v12H8l-4 4zM9 9h6"/>',
    alert:'<path d="M12 3l10 18H2zM12 10v5M12 18v.01"/>'
  };
  const MENU = [
    ["Dashboards","home"],["Heat Map","map"],["User Management","finger"],["Territory","tree"],
    ["Customer Master","store"],["Product Master","box"],["Tracking","pin"],["Target Management","target"],
    ["Inspection","bulb"],["Primary Order","clip"],["Secondary Order","receipt"],["Return","card"],
    ["Attendance","user"],
    ["Stocks","bars",["Transfer Transfer","Stocks Ledger","Transfer Report","Stock Adjustment","Adjustment Approval","Adjustment History","DB Stock Summary"]],
    ["Report","file",["Dashboard Setup"],true],["Dynamic Reports","bars"],["Primary Report","file"],["Custom Report","file"],
    ["Allowance","wallet"],["Notification","bell"],["Payment","cash"],["Short Credit","card"],
    ["Claim","claim"],["Complaint","alert"]
  ];
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const ACTIVE = "Dashboard Setup";
  $("nav").innerHTML = MENU.map(([name,ic,sub,open])=>`
    <div class="group${open?" open":""}">
      <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[ic]}</svg><span class="lbl">${name}</span>${chev}</a>
      ${sub?`<div class="sub">${sub.map(s=>`<a href="#"${s===ACTIVE?' class="active"':""}><span class="lbl">${s}</span></a>`).join("")}</div>`:""}
    </div>`).join("");
  document.querySelector(".nav .sub a.active")?.scrollIntoView({block:"center"});
  $("nav").addEventListener("click", e=>{
    const a = e.target.closest("a"); if(!a) return;
    e.preventDefault();
    const g = a.parentElement;
    if(g.classList.contains("group") && g.querySelector(".sub")) g.classList.toggle("open");
  });

  // ---------- Topbar ----------
  const mq = window.matchMedia("(max-width:820px)");
  const setMenuIcon = ()=>{
    const open = mq.matches ? document.body.classList.contains("nav-open") : !document.body.classList.contains("collapsed");
    $("menuIcon").innerHTML = open ? '<path d="M6 6l12 12M18 6L6 18"/>' : '<path d="M4 6h16M4 12h16M4 18h16"/>';
  };
  $("menuBtn").addEventListener("click", ()=>{
    document.body.classList.toggle(mq.matches ? "nav-open" : "collapsed");
    setMenuIcon();
  });
  $("scrim").addEventListener("click", ()=>{ document.body.classList.remove("nav-open"); setMenuIcon(); });
  mq.addEventListener("change", setMenuIcon);
  setMenuIcon();

  const root = document.documentElement;
  try{ const t = localStorage.getItem("kpi-theme"); if(t) root.dataset.theme = t; }catch(e){}
  $("themeBtn").addEventListener("click", ()=>{
    const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try{ localStorage.setItem("kpi-theme", root.dataset.theme); }catch(e){}
  });
  $("fsBtn").addEventListener("click", ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>{});
  });

  let tt;
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1600); }

  const roleSel = $("roleSel");
  const opt = (v,label,extra="")=>`<option value="${esc(v)}"${extra}>${esc(label)}</option>`;

  function renderPolicy(){
    const tabs = policies.order.map(r=>
      `<button class="tab${r===current?" active":""}" role="tab" aria-selected="${r===current}" data-tab="${esc(r)}">${esc(r)}</button>`);
    if(draft) tabs.push(`<button class="tab draft${current===DRAFT?" active":""}" role="tab" aria-selected="${current===DRAFT}" data-tab="${DRAFT}">${esc(draft.role||"Select Role")}</button>`);
    $("tabs").innerHTML = tabs.join("");
    const act = $("tabs").querySelector(".tab.active");
    if(act) $("tabs").scrollLeft = act.offsetLeft - 40;

    // Select Role: every role; picking one with a saved policy opens its tab,
    // picking one without a policy starts a new policy for it
    roleSel.innerHTML = opt("","e.g. Sales-Representative"," disabled hidden") + ROLES.map(r=>opt(r,r)).join("");
    roleSel.value = role() || "";
    roleSel.classList.toggle("is-placeholder", !role());
    $("delPolicyBtn").disabled = !current;
  }

  $("tabs").addEventListener("click", e=>{
    const b = e.target.closest("[data-tab]"); if(!b) return;
    const key = b.dataset.tab;
    if(key===current || !confirmLeave()) return;
    open(key);
  });
  $("addPolicyBtn").addEventListener("click", ()=>{
    if(current!==DRAFT){
      if(!confirmLeave()) return;
      if(!draft) draft = {role:"", list:[]};
      open(DRAFT);
    }
    roleSel.focus();
  });
  $("delPolicyBtn").addEventListener("click", ()=>{
    if(current===DRAFT){
      if(draft.role && !confirm("Discard this new policy?")) return;
      draft = null; current = null;
    }else{
      if(!confirm(`Delete the dashboard policy for ${current}?`)) return;
      const r = current;
      policies.order = policies.order.filter(x=>x!==r);
      delete policies.lists[r];
      persist(); current = null;
      toast(`${r} dashboard policy deleted`);
    }
    if(policies.order.length) open(policies.order[0]);
    else { draft = {role:"", list:[]}; open(DRAFT); }
  });
  roleSel.addEventListener("change", ()=>{
    const r = roleSel.value;
    if(policies.order.includes(r)){
      if(!confirmLeave()){ renderPolicy(); return; }
      open(r);
    }else if(current===DRAFT){
      draft.role = r;
      renderPolicy(); renderPhone(); markDirty();
    }else{
      if(!confirmLeave() || (draft && draft.list.length && !confirm(`Discard the unsaved new policy for ${draft.role}?`))){ renderPolicy(); return; }
      draft = {role:r, list:[]};
      open(DRAFT);
    }
  });

  $("saveBtn").addEventListener("click", save);
  document.addEventListener("keydown", e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); if(role() && isDirty()) save(); }
  });
  window.addEventListener("beforeunload", e=>{ if(role() && isDirty()){ e.preventDefault(); e.returnValue=""; } });

  if(policies.order.length) open(policies.order[0]);
  else { draft = {role:"", list:[]}; open(DRAFT); }
})();
</script>
</body>
</html>
