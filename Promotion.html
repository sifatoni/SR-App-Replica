<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotion — Sokrio DMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#845adf;--pri-rgb:132,90,223;--pri10:rgba(132,90,223,.1);--pri20:rgba(132,90,223,.22);--navy:#111c43;--navy2:#1a2654;--bg:#f0f1f7;--card:#fff;--txt:#333335;--mut:#8c9097;--line:#eef0f7;--line2:#e2e5ef;--ok:#26bf94;--okbg:rgba(38,191,148,.12);--okt:#139b74;--warn:#f5b849;--warnbg:rgba(245,184,73,.16);--warnt:#b77b0e;--err:#e6533c;--errbg:rgba(230,83,60,.1);--errt:#c43b25;--info:#49b6f5;--infobg:rgba(73,182,245,.12);--infot:#1a86c4;
 --t-category:#1f8cda;--t-category-bg:#e1f1fc;--t-brand:#ef7f00;--t-brand-bg:#fff0dc;--t-product:#1f9d3a;--t-product-bg:#e3f5dc;--sh:0 1px 2px rgba(10,10,10,.04),0 6px 16px -10px rgba(30,30,60,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Poppins,'Segoe UI',system-ui,sans-serif;font-size:13px;color:var(--txt);min-height:100vh}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* shell */
.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--navy);color:#a3aed1;display:flex;flex-direction:column;z-index:20}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700;font-size:20px;letter-spacing:.06em;color:#4aa3ff}
.brand svg{flex:0 0 auto}
.menu{padding:10px 12px;overflow-y:auto;flex:1}
.menu .cat{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6f7aa3;padding:16px 12px 8px}
.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#c3cbe6;text-decoration:none;font-size:13px}
.menu a:hover{background:rgba(255,255,255,.05)}
.menu a.grp{background:rgba(255,255,255,.07);color:#fff;font-weight:600}
.menu .sub{padding:4px 0 6px 30px}
.menu .sub a{font-size:12.5px;padding:7px 10px;color:#a3aed1}
.menu .sub a::before{content:"";width:5px;height:5px;border-radius:50%;border:1px solid currentColor;margin-right:4px}
.menu .sub a.on{color:#fff;font-weight:600}
.menu .sub a.on::before{background:#fff}
.main{margin-left:240px;min-width:0}
.hdr{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:15}
.hdr .sp{flex:1}
.hdr .who{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}
.hdr .who i{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px}
.wrap{padding:20px 24px 60px;max-width:1560px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.crumb{font-size:12px;color:var(--mut)}
.crumb a{color:var(--pri);text-decoration:none}
.crumb b{color:var(--txt);font-weight:600}

/* controls */
.card{background:var(--card);border-radius:10px;box-shadow:var(--sh);border:1px solid var(--line)}
.ccard{border:1px solid var(--pri20)}
.cardh{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.cardh h2{font-size:14px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
.cardh h2 .step{width:22px;height:22px;border-radius:7px;background:var(--pri10);color:var(--pri);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cardh small{font-size:12px;color:var(--mut);font-weight:400}
.cardb{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:7px;font-weight:500;font-size:12.5px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn.o{border:1px solid var(--pri);color:var(--pri);background:#fff}
.btn.o:hover{background:var(--pri);color:#fff}
.btn.p{background:var(--pri);color:#fff;box-shadow:0 6px 14px -8px rgba(var(--pri-rgb),.9)}
.btn.p:hover{background:#7448d6}
.btn.g{color:#61646b;border:1px solid var(--line2);background:#fff}
.btn.g:hover{border-color:var(--pri);color:var(--pri)}
.btn.d{color:var(--errt);border:1px solid #f5c6be;background:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.hl{background:linear-gradient(135deg,#9b7af0,#6d3fd8);color:#fff;border:none;box-shadow:0 8px 18px -10px rgba(109,63,216,.9)}
.btn.hl:hover{filter:brightness(1.06)}
.newtag{font-size:9.5px;font-weight:700;background:#fff;color:var(--pri);padding:1px 6px;border-radius:999px;letter-spacing:.03em}
.ic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--pri);background:#fff}
.ic:hover{background:var(--pri10)}
.ic.d{color:var(--errt)}
.fg label{display:block;font-size:12px;font-weight:500;margin-bottom:5px;color:#4d5157}
.fg label .rq{color:var(--err)}
.inp,.sel{width:100%;height:36px;border:1px solid var(--line2);border-radius:7px;padding:0 10px;background:#fff;outline:none}
.inp:focus,.sel:focus{border-color:var(--pri)}
.inp.bad,.sel.bad,.picker.bad{border-color:var(--err);background:#fffafa}
.err{font-size:11.5px;color:var(--errt);margin-top:4px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ltabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.ltabs button{padding:12px 14px;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.ltabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.ltabs .c{font-size:11px;background:var(--bg);padding:1px 7px;border-radius:999px;color:#61646b}
.ltabs button.on .c{background:var(--pri10);color:var(--pri)}
.pop .po.all{margin:4px 4px 0;width:calc(100% - 8px);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;padding-bottom:9px}
.pop .po.all b{font-weight:600}
.pop .po:disabled{opacity:.45;cursor:default}
.cbx.part{background:var(--pri);border-color:var(--pri)}
.cbx.part i{display:block;width:8px;height:2px;background:#fff;border-radius:2px}
.plain .op{font-weight:700;color:var(--pri);font-size:11.5px;letter-spacing:.04em}
.pm-scrim{position:fixed;inset:0;z-index:40;background:rgba(17,28,67,.45);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow-y:auto}
.pm{background:#fff;border-radius:10px;width:min(920px,100%);box-shadow:0 30px 60px -20px rgba(17,28,67,.55);display:flex;flex-direction:column}
.pmh{display:flex;align-items:center;padding:18px 24px 12px}
.pmh h3{flex:1;font-size:16px;font-weight:600}
.pmx{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#333}
.pmx:hover{background:var(--bg)}
.pmb{padding:0 24px;display:flex;flex-direction:column;gap:22px}
.sec{border:1px solid var(--pri);border-radius:8px}
.sech{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;position:relative}
.sech::before{content:"";position:absolute;left:10px;top:15px;bottom:15px;width:3px;border-radius:3px;background:var(--pri20)}
.sech{padding-left:22px}
.sech small{font-weight:400;font-size:12px;color:var(--mut);margin-left:auto}
.secb{padding:18px 20px}
.ocm{margin-top:18px;border:1px solid var(--pri);border-radius:8px;padding:16px 20px 20px}
.ocmh{font-weight:600;font-size:13.5px;margin-bottom:14px;padding-left:10px;border-left:3px solid var(--pri)}
.ocmo{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--line2);background:#fafbfe;min-height:92px}
.ocmo.on{border:2px solid var(--pri);background:#fff}
.ocmo b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.ocmo.on b{color:var(--pri)}
.ocmo em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--pri);background:var(--pri10);padding:1px 8px;border-radius:999px}
.ocmo span{display:block;font-size:12px;color:#61646b;margin-top:4px}
.ocmo code{display:inline-block;margin-top:8px;font-size:11px;color:var(--pri);background:var(--pri10);border:1px solid var(--pri20);padding:3px 10px;border-radius:999px;font-family:ui-monospace,Consolas,monospace}
.ocmo .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid #9aa0b4;flex:0 0 auto;margin-top:3px;position:relative}
.ocmo.on .rd{border-color:var(--pri)}.ocmo.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--pri)}
.pmf{padding:18px 24px 18px}
.nb{color:var(--errt);font-size:12px;margin-bottom:10px}
.pmfr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pmerr{color:var(--errt);font-weight:600;font-size:12px;margin-left:6px}
.btn.ok{border:1px solid var(--ok);color:var(--okt);background:#fff}.btn.ok:hover{background:var(--ok);color:#fff}
.btn.wr{border:1px solid var(--warn);color:var(--warnt);background:#fff}.btn.wr:hover{background:var(--warn);color:#fff}
.btn.dg{border:1px solid var(--err);color:var(--errt);background:#fff}.btn.dg:hover{background:var(--err);color:#fff}
.inp:disabled{background:#f3f4f8;color:var(--mut)}
.pit+.pit{margin-top:10px}
.pit.isg .gprow{background:#fbfaff;border:1px solid var(--pri20);border-radius:8px;padding:4px 10px}
.gprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;line-height:2}
.gprow .gpc{flex:1;min-width:0}
.pitfoot{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.dpw{position:relative}
.dpin{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:36px;border:1px solid var(--line2);border-radius:7px;padding:0 10px;background:#fff;text-align:left;color:var(--txt);font-variant-numeric:tabular-nums}
.dpin svg{color:#b3b6c2;flex:0 0 auto}
.dpin .ph{color:#b3b6c2}
.dpin:hover,.dpin.on{border-color:var(--pri)}
.dpin.dis{background:#f3f4f8;cursor:not-allowed;border-color:var(--line2)}
.dp{position:absolute;z-index:45;top:calc(100% + 4px);left:0;width:400px;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);font-size:14px;color:rgba(0,0,0,.88)}
.dp.r{left:auto;right:0}
.dpmain{display:flex}
.dpcal{width:290px;border-right:1px solid #f0f0f0}
.dph{display:flex;align-items:center;height:40px;padding:0 8px;border-bottom:1px solid #f0f0f0}
.dph b{flex:1;text-align:center;font-weight:600}
.dph.c{justify-content:center}
.dph button{width:26px;height:26px;color:rgba(0,0,0,.35);font-size:16px;line-height:1}
.dph button:hover{color:rgba(0,0,0,.88)}
.dpt{width:100%;border-collapse:collapse;margin:6px 0 8px}
.dpt th{font-weight:400;height:32px;text-align:center;padding:0;background:none;border:0;font-size:14px;color:rgba(0,0,0,.88)}
.dpt td{padding:3px 0;text-align:center;border:0;white-space:nowrap}
.dpt td.dis{background:rgba(0,0,0,.04)}
.dpt td.out .dc{color:rgba(0,0,0,.25)}
.dc{min-width:26px;height:26px;border-radius:5px;font-size:14px;color:rgba(0,0,0,.88)}
.dc:hover:not(:disabled){background:rgba(0,0,0,.04)}
.dc:disabled{color:rgba(0,0,0,.25);cursor:not-allowed}
.dc.td{box-shadow:inset 0 0 0 1px var(--pri)}
.dc.sel{background:var(--pri);color:#fff;box-shadow:none}
.dptm{flex:1;display:flex;flex-direction:column;min-width:0}
.dpcols{display:flex;height:252px}
.dpcol{list-style:none;flex:1;overflow-y:auto;padding:4px;margin:0;scrollbar-width:thin}
.dpcol+.dpcol{border-left:1px solid #f0f0f0}
.dpcol::after{content:"";display:block;height:220px}
.dpcol li button{display:block;width:100%;height:28px;border-radius:4px;font-size:14px;color:rgba(0,0,0,.88)}
.dpcol li button:hover{background:rgba(0,0,0,.04)}
.dpcol li button.on{background:#efe9ff;font-weight:600}
.dpf{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f0f0;padding:8px 12px}
.dpnow{color:var(--pri);font-size:14px}
.dpok{height:24px;padding:0 8px;border-radius:4px;background:var(--pri);color:#fff;font-size:13px}
.dpok:disabled{background:rgba(0,0,0,.04);color:rgba(0,0,0,.25);border:1px solid #d9d9d9;cursor:not-allowed}
.cas{cursor:pointer;flex-wrap:nowrap;gap:4px;padding:3px 28px 3px 6px}
.cas.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri10)}
.ttag{display:inline-flex;align-items:center;gap:4px;max-width:200px;height:26px;padding:0 4px 0 8px;border-radius:4px;background:#f0f1f5;font-size:12.5px;color:#333335;flex:0 1 auto;min-width:0}
.ttag>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttag button{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:#8c9097;flex:0 0 auto}
.ttag button:hover{color:#333}
.ttag.more{padding-right:8px;flex:0 0 auto;color:#61646b}
.tq{flex:1 1 40px;min-width:40px;border:none;outline:none;background:none;height:26px;font-size:13px;padding:0 4px;color:var(--txt)}
.tq::placeholder{color:#b3b6c2}
.tq:focus-visible{outline:none}
.tq.has{flex:0 1 10px;min-width:6px}
.tq.has:focus{flex-basis:60px}
.ttag{flex:0 1 auto;max-width:none}
.cpop{position:absolute;left:-1px;top:calc(100% + 4px);z-index:35;display:flex;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);cursor:default;max-width:calc(100vw - 60px);overflow-x:auto}
.ccol{list-style:none;margin:0;padding:4px;min-width:150px;max-height:260px;overflow-y:auto}
.ccol+.ccol{border-left:1px solid #f0f0f0}
.ccol li{display:flex;align-items:center;border-radius:4px;padding-left:8px}
.ccol li:hover{background:rgba(0,0,0,.04)}
.ccol li.act{background:#f3effd}
.ccol .cck{display:flex;align-items:center;padding:7px 6px 7px 0}
.ccol .clb{flex:1;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 2px;text-align:left;font-size:13px;color:#333335;white-space:nowrap}
.ccol .clb span{flex:1}
.ccol .clb span.b,.ccol li.act .clb span{font-weight:600}
.ccol .clb small{font-size:12px;color:#61646b}
.ccol .clb svg{color:#8c9097;flex:0 0 auto}
.cpop.srch{flex-direction:column;min-width:320px;max-height:280px;overflow-y:auto;padding:4px}
.crow2{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;text-align:left;font-size:13px}
.crow2:hover{background:rgba(0,0,0,.04)}
.cempty{padding:14px;color:var(--mut);font-size:12.5px}
.tig{display:flex;align-items:stretch}
.tig .tpk{flex:1;min-width:0;border-radius:7px 0 0 7px;padding-right:28px;flex-wrap:nowrap;overflow:visible}
.tig .tpk .ichip{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.tchev{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#4d5157;display:flex}
.tbulk{display:inline-flex;align-items:center;gap:5px;height:auto;min-height:36px;padding:0 11px;border:1px solid var(--line2);border-left:0;border-radius:0 7px 7px 0;background:#f9fafc;color:var(--pri);font-size:12px;font-weight:600;white-space:nowrap}
.tbulk:hover{background:var(--pri10)}
.tf .tfl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.tf .tfl label{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opt-tag{font-size:10.5px;font-weight:500;color:var(--warnt);background:var(--warnbg);padding:1px 7px;border-radius:999px}
.link.sm{font-size:12px;display:inline-flex;align-items:center;gap:4px;color:var(--pri);font-weight:600}
.tf .picker{min-height:36px}
.more{font-size:12px;color:var(--mut);padding:0 4px}
.tsum{font-size:11.5px;color:#61646b;margin-top:5px}
.tsum b{font-weight:600;color:var(--txt)}
.pop .po.grp b{font-weight:600}
.pop .po.sub{padding-left:30px}
.bustep{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line2)}
.bustep:last-child{border-bottom:0}
.bustep>span{width:24px;height:24px;border-radius:50%;background:var(--pri10);color:var(--pri);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bustep>div{flex:1;min-width:0}
.bustep b{font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px;padding:18px;border:1.5px dashed #c9cde0;border-radius:10px;background:#fafbfe;color:var(--mut);cursor:pointer;text-align:center}
.drop:hover,.drop.on{border-color:var(--pri);background:#fbfaff;color:var(--pri)}
.drop span{font-size:12.5px;color:var(--txt)}.drop small{font-size:11px}
.bucnt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 8px}
.bucnt span{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.bucnt .ok{background:var(--okbg);color:var(--okt)}.bucnt .bad{background:var(--errbg);color:var(--errt)}.bucnt .dup{background:#f0f1f5;color:#61646b}.bucnt .hint{font-weight:500;background:none;padding:0}
.butw{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.butw table{font-size:12px}.butw th{position:sticky;top:0;background:#f9fafc;padding:7px 10px}.butw td{padding:6px 10px}
.butw tr.bad td{color:var(--errt);background:#fff8f7}.butw tr.dup td{color:var(--mut)}
.bumode{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.bumode input{accent-color:var(--pri);margin-right:5px}
.capline{display:flex;gap:7px;align-items:center;margin-top:8px;font-size:12px;color:var(--okt);background:var(--okbg);border-radius:7px;padding:6px 10px;width:max-content;max-width:100%}
.capline svg{flex:0 0 auto}
.gphint{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12px;color:#4d5157;background:#fbfaff;border:1px solid var(--pri20);border-radius:8px;padding:9px 12px}
.gphint svg{flex:0 0 auto;margin-top:2px;color:var(--pri)}
.crow .lbl.nw{white-space:nowrap}
.rcell{display:flex;align-items:center;gap:6px}
.rcell .sel{flex:1;min-width:0}
.rcell .rk{width:56px;flex:0 0 56px;padding:0 6px;text-align:center}
.rof{font-size:12px;color:#61646b;white-space:nowrap}
.ichip .pin{width:16px;height:16px;font-size:13px;line-height:1;opacity:.55;margin-left:-3px}
.ichip .pin:hover{opacity:1;background:none}
.ichip.must{background:var(--c);color:#fff;font-weight:600}
.ichip.must .pin{opacity:1;color:#ffd666}
.ichip.must button{color:#fff}
.rrule{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}

/* "How this offer is calculated" — Product Set promotions only */
function calcBox(o,i){
  var sets=setItems(),sum=svSum(o),pv=+o.pv||0,miss=[],blocks='',amt=PF.ptype==='amount';
  var tot=function(v){return amt?'<b class="num">Tk '+Number(v).toLocaleString('en-IN')+'</b>':'<b class="num">'+nPcs(v)+'</b>'};
  sets.forEach(function(it,k){
    var g=gpOf(it.id.slice(3)),nm=g?g.title:it.id,m=+it.min||0,v=+o.sv[it.id]||0,n=setProds(it.id.slice(3));
    if(!v)miss.push(nm);
    var lines=[];
    if(it.rule==='unique')lines.push('Buy at least <b>'+nUnique(m)+'</b> from this set (this set has '+nUnique(n)+').');
    else if(it.rule==='open')lines.push('Buy at least <b>'+nPcs(m)+'</b> from this set. The same product can be bought again.');
    lines.push(v?'From this set, buy '+(amt?'worth ':'')+'at least '+tot(v)+' in total.':'<span class="cbwait">Enter '+svUnit()+' of '+esc(nm)+'.</span>');
    blocks+='<div class="cbblk"><div class="cbt"><span class="cbn">'+(k+1)+'</span>'+esc(nm)+(it.rule?'<span class="cb-rule">'+(it.rule==='open'?'Open':'Unique')+'</span>':'')+'</div><ul>'+lines.map(function(l){return '<li>'+l+'</li>'}).join('')+'</ul></div>';
  });
  var all=[];
  if(pv)all.push('The order must have '+(amt?'':'at least ')+tot(pv)+(amt?' or more':'')+' from these sets in total.');
  if(sum)all.push(sets.map(function(it){var g=gpOf(it.id.slice(3));return esc(g?g.title:it.id)+' '+tot(+o.sv[it.id]||0)}).join(' + ')+' = '+tot(sum)+'.');
  if(pv>sum&&sum)all.push('So '+tot(pv-sum)+' more '+(amt||pv-sum===1?'is':'are')+' needed. '+(amt||pv-sum===1?'It':'They')+' can come from any of these sets.');
  if(all.length)blocks+='<div class="cbblk"><div class="cbt"><span class="cbn">'+(sets.length+1)+'</span>All sets together</div><ul>'+all.map(function(l){return '<li>'+l+'</li>'}).join('')+'</ul></div>';
  var rew=[];if(o.ot==='percent'&&+o.ov)rew.push(o.ov+'% off');if(o.ot==='amount'&&+o.ov)rew.push('Tk '+o.ov+' off');if(o.ot==='qty')rew.push('Free product (see the Offer Slab)');if(+o.ad)rew.push('Extra '+o.ad+'% off');
  var short=miss.length?'Enter '+svUnit()+' of '+miss.map(esc).join(', ')+' to see the calculation':'Total '+(pv?(amt?'Tk '+pv:nPcs(pv)):'—')+' or more from '+sets.length+' set'+(sets.length===1?'':'s')+(rew.length?' → '+rew[0]:'');
  var h='<div class="cbox'+(o.cbMin?' min':'')+'"><button class="cbh" data-act="cbtog:'+i+'" aria-expanded="'+!o.cbMin+'">'+I.check+'How this offer is calculated'+(o.cbMin?'<span class="cbs">'+short+'</span>':'')+'<span class="chev">'+I.chev+'</span></button>';
  if(o.cbMin)return h+'</div>';
  h+=blocks;
  if(rew.length)h+='<div class="cbblk cbgot"><div class="cbt">The customer gets</div><ul>'+rew.map(function(r){return '<li><b>'+r+'</b></li>'}).join('')+(+o.mx?'<li>Maximum discount: <b>Tk '+Number(o.mx).toLocaleString('en-IN')+'</b> per order</li>':'')+'</ul></div>';
  return h+'</div>';
}

function pvalidate(status){
  PERR={};
  if(status==='active'&&!PF.terr.length)PERR['p-terr']='Territory is required to activate. You can still save as Draft.';
  if(!PF.title.trim())PERR['p-title']='Promotion title is required';
  if(!PF.start)PERR['p-start']='Required';
  if(!PF.end)PERR['p-end']='Required';else if(PF.start&&PF.end<PF.start)PERR['p-end']='Must be after start';
  if(!PF.act)PERR['p-act']='Required';
  if(!PF.ptype)PERR['p-ptype']='Required';
  if(!PF.on)PERR['p-on']='Required';
  if(PF.on)PF.items.forEach(function(it,i){if(!it.id)PERR['it-'+i]='Select a '+(PF.on==='group'?'Product Set':PF.on==='product'?'product':TYPES[PF.on].n.toLowerCase())});
  setItems().forEach(function(it){var i=PF.items.indexOf(it),g=gpOf(it.id.slice(3)),n=setProds(it.id.slice(3));
    if(!(+it.min>0))PERR['min-'+i]='Enter the Minimum Value for '+(g?g.title:'this set');
    else if(it.rule==='unique'&&+it.min>n)PERR['min-'+i]=(g?g.title:'This set')+' has only '+n+' products — with Unique, Minimum Value can be at most '+n;
    if(!it.rule)PERR['rule-'+i]='Choose a Product Rule (Unique or Open)';});
  if(setItems().length)PF.offers.forEach(function(o,i){
    if(!svUnit())return;
    setItems().forEach(function(it){var v=o.sv[it.id],m=+it.min||0,k='sv-'+i+'-'+it.id;
      if(v===''||v==null||!(+v>0))PERR[k]='Required';else if(+v<m)PERR[k]='Can’t be less than the Minimum Value ('+m+')';});
    if(+o.pv<svSum(o))PERR['pv-'+i]='Must be at least '+svSum(o);});
  PF.offers.forEach(function(o,i){if(!(+o.pv>0))PERR['pv-'+i]='Required';if(!o.ot)PERR['ot-'+i]='Required';if(o.ot&&o.ot!=='qty'&&!(+o.ov>0))PERR['ov-'+i]='Required';if(o.mx!==''&&o.mx!=null&&!(+o.mx>0))PERR['mx-'+i]='Max discount must be more than 0';else if(+o.mx&&o.ot==='amount'&&PF.mode==='fixed'&&+o.ov>+o.mx)PERR['mx-'+i]='Max discount (Tk '+o.mx+') is lower than the offer value (Tk '+o.ov+')';});
  return !Object.keys(PERR).length;
}

   case 'skmf':{var ft=p[1],fv=p[2],fa=SKM.f[ft],fi=fa.indexOf(fv);if(fi>-1)fa.splice(fi,1);else{fa.push(fv);SKM.sec[ft]=1;}skmPrune(FORD.findIndex(function(o){return o[0]===ft})+1);SKM.lim=100;var l0=$('#skmlist');if(l0)l0.scrollTop=0;render();var l1=$('#skmlist');if(l1)l1.scrollTop=0;break;}
   case 'skmfclear':SKM.f={br:[],ct:[],m:[],sku:[]};SKM.nis=false;SKM.lim=100;render();break;
   case 'skmnis':SKM.nis=!SKM.nis;skmPrune(0);SKM.lim=100;render();break;
   case 'clearsel':rowAt(p[1]).items=[];rowAt(p[1]).bat={};render();break;
   case 'rmitem':{var r2=rowAt(p[1]);r2.items=r2.items.filter(function(x){return x!==p[2]});if(r2.bat)delete r2.bat[p[2]];r2.must=(r2.must||[]).filter(function(x){return x!==p[2]});render();break;}
   case 'must':{var r4=rowAt(p[1]),m4=r4.must||(r4.must=[]),j4=m4.indexOf(p[2]);if(j4>-1)m4.splice(j4,1);else m4.push(p[2]);if(ruleOf(r4)==='atleast'&&+r4.k<mustOf(r4).length)r4.k=mustOf(r4).length;render();break;}
   case 'mode':F.groups[+p[1]].mode=p[2];render();break;
   case 'rrule':{var rr=rowAt(p[1]);rr.rule=p[2];if(p[2]==='atleast'){rr.k=Math.min(Math.max(+rr.k||2,1),rr.items.length-1);}render();break;}
   case 'addrow':F.groups[+p[1]].rows.push(row(p[2],[]));OPEN=p[1]+'-'+(F.groups[+p[1]].rows.length-1);POPQ='';render();break;
   case 'rmrow':{var q=p[1].split('-'),g=F.groups[+q[0]];if(g.rows.length<2)break;g.rows.splice(+q[1],1);if(g.n>g.rows.length)g.n=Math.max(1,g.rows.length);ERR={};OPEN=null;render();break;}
   case 'reset':var keepCode=F.code;F=blank();F.code=EDIT>-1?keepCode:nextCode();ERR={};OPEN=null;render();toast('Form cleared');break;
   case 'canceledit':F=blank();F.code=nextCode();EDIT=-1;ERR={};OPEN=null;render();break;
   case 'gexp':GEXP[p[1]]=!GEXP[p[1]];render();break;
   case 'save':save(p[1]);break;
   case 'view':viewModal(+p[1]);break;
   case 'edit':{F=JSON.parse(JSON.stringify(POLICIES[+p[1]]));EDIT=+p[1];ERR={};OPEN=null;VIEW='new';closeModal();render();window.scrollTo(0,0);break;}
   case 'gsw':{var gi2=+p[1],gg=POLICIES[gi2],used2=PROMOS.filter(function(x){return x.gps&&x.gps.indexOf(gg.code)>-1}),nm='<b>'+esc(gg.code)+' · '+esc(gg.title)+'</b>';
     if(gg.status==='active'){
       confirmModal('Make '+nm+' inactive?<br><span class="hint">It can\'t be selected in new promotions. Nothing is deleted — you can activate it again any time.</span>'+(used2.length?'<div class="usedl"><b style="font-size:12px">Used in '+used2.length+' promotion'+(used2.length>1?'s':'')+'</b>'+used2.map(function(x){return '<span>'+esc(x.name)+' '+stPill(x.status)+'</span>'}).join('')+'</div>':''),function(){gg.status='inactive';closeModal();render();toast(gg.code+' is now inactive');},{title:'Make Product Set inactive?',btn:'Make inactive',warn:true});
     }else{
       confirmModal('Activate '+nm+'?<br><span class="hint">It will be available in Add Promotion → Select Product Set.</span>',function(){gg.status='active';closeModal();render();toast(gg.code+' is now active');},{title:'Activate Product Set?',btn:'Activate'});
     }
     break;}
   case 'dup':{var rc=POLICIES[+p[1]];F=JSON.parse(JSON.stringify(rc));F.title=rc.title+' (copy)';delete F.status;delete F.entry;F.code=nextCode();EDIT=-1;ERR={};OPEN=null;VIEW='new';closeModal();render();window.scrollTo(0,0);toast('Duplicated — review and save');break;}
   case 'padd':PF=pblank();PERR={};PNOTE={};DP=null;VIEW='promo';render();break;
   case 'preset':PF=pblank();PERR={};PNOTE={};DP=null;render();toast('Form cleared');break;
   case 'pmode':PF.mode=p[1];render();break;
   case 'dpnone':break;
   case 'topen':OPEN=OPEN==='terr'?null:'terr';if(!OPEN)TQ='';render();if(OPEN){var tq=$('#tq');if(tq)tq.focus();}break;
   case 'topen1':if(OPEN!=='terr'){OPEN='terr';render();var tq1=$('#tq');if(tq1)tq1.focus();}break;
   case 'tnode':{var nd=NODES[p[1]],ls=leavesOf(nd),full=nState(nd)===2;tset(full?PF.terr.filter(function(c){return ls.indexOf(c)<0}):PF.terr.concat(ls));render();var tq2=$('#tq');if(tq2&&TQ)tq2.focus();break;}
   case 'tuncheck':{var nu=NODES[p[1]],lu=leavesOf(nu);tset(PF.terr.filter(function(c){return lu.indexOf(c)<0}));render();break;}
   case 'texp':TPATH=TPATH.slice(0,+p[1]);TPATH[+p[1]]=p[2];render();break;
   case 'tclear':tset([]);render();break;
   case 'bulkterr':OPEN=null;render();buOpen();break;
   case 'tlist':OPEN=null;TL={q:'',open:{}};render();tlRender();break;
   case 'tlclose':TL=null;tlRender();break;
   case 'tlexp':TL.open[p[1]]=!TL.open[p[1]];tlRender();break;
   case 'tlrm':{var nr=NODES[p[1]],lr=leavesOf(nr);tset(PF.terr.filter(function(c){return lr.indexOf(c)<0}));render();if(!PF.terr.length)TL=null;tlRender();toast(nr.n+' removed');break;}
   case 'buclose':BU=null;buRender();break;
   case 'busample':buParse('territory_code\nT-M12\nT-M01\nUTTARA\nNational (S)\nT-XYZ9\nT-M12\nSample Pharma Ltd\n','sample_territories.csv');break;
   case 'butpl':{try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['territory_code,territory_name\nT-M12,MIRPUR 12\nT-M01,MIRPUR 1\nNAT,National (S) - everything under it\n'],{type:'text/csv'}));a.download='territory_upload_template.csv';document.body.appendChild(a);a.click();a.remove();toast('Template downloaded');}catch(e){toast('Download not available here',1);}break;}
   case 'buapply':{var codes=buCodes(),n2=codes.length;tset(BU.mode==='replace'?codes:PF.terr.concat(codes));BU=null;buRender();render();toast(n2+' territor'+(n2>1?'ies':'y')+' added from file');break;}
   case 'dpopen':if(DP&&DP.f===p[1]){DP=null;}else dpOpen(p[1]);render();dpScroll();break;
   case 'dpnav':{var d=new Date(DP.y,DP.m+(+p[1]),1);DP.y=d.getFullYear();DP.m=d.getMonth();render();dpScroll();break;}
   case 'dpday':DP.sel=p[1];render();dpScroll();break;
   case 'dph':DP.h=+p[1];render();dpScroll();break;
   case 'dpm':DP.mi=+p[1];render();dpScroll();break;
   case 'dpnow':{var n=new Date();dpSet(DP.f,ymd(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes()));DP=null;render();break;}
   case 'dpok':{var val=DP.sel+' '+pad(DP.h)+':'+pad(DP.mi);if(DP.f==='end'&&PF.start&&val<PF.start){toast('Expire time must be after the start time',1);break;}dpSet(DP.f,val);DP=null;render();break;}
   case 'pitadd':PF.items.push({id:'',min:'',rule:''});render();break;
   case 'pitrm':PF.items.splice(+p[1],1);render();break;
   case 'pofadd':PF.offers.push(blankOffer());render();break;
   case 'cbtog':var co=PF.offers[+p[1]];if(co){co.cbMin=!co.cbMin;render();}break;
   case 'pofrm':PF.offers.splice(+p[1],1);render();break;
   case 'sladd':PF.offers[+p[1]].slab.push({p:'',q:''});render();break;
   case 'slrm':{var sq=p[1].split('-');PF.offers[+sq[0]].slab.splice(+sq[1],1);render();break;}
   case 'psave':psave(p[1]);break;
   case 'mclose':closeModal();break;
   case 'mok':if(MOK)MOK();break;
  }
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  var stop=e.target.closest('[data-stop]');
  if(OPEN&&!e.target.closest('.picker')){OPEN=null;POPQ='';TQ='';if(!t){render();return;}}
  if(DP&&!e.target.closest('.dp')&&!e.target.closest('.dpin')){DP=null;if(!t){render();return;}}
  if(!t)return;
  if(e.target.closest('.pop')&&!e.target.closest('.po')&&!e.target.closest('.bx')&&!e.target.closest('.pf button'))return;
  if(stop&&(t.dataset.act==='mclose'||t.dataset.act==='buclose')&&t.classList.contains('scrim')&&e.target!==t)return;
  if(e.target.closest('#budrop'))return;
  if(e.target.closest('.cpop')&&t.dataset.act==='topen')return;
  if(t.disabled)return;
  e.preventDefault();e.stopPropagation();act(t.dataset.act,t);
},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SKM){SKM=null;document.body.style.overflow='';render();return;}
  if(e.key==='Escape'&&DP){DP=null;render();return;}
  if(e.key==='Escape'){if(OPEN){OPEN=null;POPQ='';render();}else if($('#modal').innerHTML)closeModal();else if(VIEW==='promo'){VIEW='list';render();}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('picker')){e.preventDefault();act(e.target.dataset.act,e.target);}
});
function bindVal(el){
  var v=el.type==='checkbox'?el.checked:el.value,b=el.dataset.bind;
  if(b){
    if(b==='title'||b==='code')F[b]=v;
    if(ERR[b]){delete ERR[b];el.classList.remove('bad');var er=el.parentNode.querySelector('.err');if(er)er.remove();}
    return 'soft';}
  if(el.dataset.row){var r=rowAt(el.dataset.row),f=el.dataset.f;if(f==='type'){r.type=v;r.items=[];return 'hard';}if(f==='rulesel'){r.rule=v;if(v==='atleast'){var nn=r.items.length,mm=(r.must||[]).filter(function(id){return r.items.indexOf(id)>-1}).length;r.k=Math.min(Math.max(+r.k||2,mm||1,1),nn);}delete ERR['k-'+el.dataset.row];return 'hard';}if(f==='k'){delete ERR['k-'+el.dataset.row];}r[f]=v;if(f==='min'&&ERR['min-'+el.dataset.row]){delete ERR['min-'+el.dataset.row];el.classList.remove('bad');}return f==='measure'||f==='unit'||f==='k'?'hard':'soft';}
  if(el.dataset.gn!=null){F.groups[+el.dataset.gn].n=Math.max(1,Math.min(+v||1,F.groups[+el.dataset.gn].rows.length));return 'soft';}
  if(el.id==='nodbl'){F.noDouble=v;return 'soft';}
  return null;
}
function pbind(el){
  var v=el.value;
  if(el.dataset.pf){var k=el.dataset.pf.slice(2);PF[k]=v;if(k==='on'){PF.items=[{id:'',min:'',rule:''}];PF.offers.forEach(function(o){o.sv={};o.pvAuto=true});PNOTE={};delete PERR['p-on'];return 'hard';}if(PERR[el.dataset.pf]){delete PERR[el.dataset.pf];el.classList.remove('bad');var er=el.parentNode.querySelector('.err');if(er)er.remove();}return el.tagName==='SELECT'||el.type==='date'?'hard':'soft';}
  if(el.dataset.pit!=null){PF.items[+el.dataset.pit][el.dataset.f]=v;delete PERR['it-'+el.dataset.pit];delete PERR['min-'+el.dataset.pit];delete PERR['rule-'+el.dataset.pit];return el.tagName==='SELECT'?'hard':'soft';}
  if(el.dataset.pof!=null){var oi=+el.dataset.pof,o=PF.offers[oi];
    if(el.dataset.f==='sv'){o.sv[el.dataset.set]=v;var sk='sv-'+oi+'-'+el.dataset.set;delete PERR[sk];delete PNOTE[sk];delete PNOTE['pv-'+oi];return 'soft';}
    o[el.dataset.f]=v;if(el.dataset.f==='pv'){o.pvAuto=false;delete PNOTE['pv-'+oi];}
    delete PERR[el.dataset.f+'-'+oi];return el.tagName==='SELECT'?'hard':'soft';}
  if(el.dataset.slab){var a=el.dataset.slab.split('-');PF.offers[+a[0]].slab[+a[1]][el.dataset.f]=v;return 'soft';}
  return null;
}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='tlq'&&TL){TL.q=el.value;var tp=el.selectionStart;tlRender();var tn=$('#tlq');tn.focus();tn.setSelectionRange(tp,tp);return;}
  if(VIEW==='promo'&&el.id!=='popq'&&el.id!=='tq'){if(el.tagName!=='SELECT')pbind(el);return;}
  if(el.id==='lq'){Q=el.value;var pos=el.selectionStart;render();var n=$('#lq');n.focus();n.setSelectionRange(pos,pos);return;}
  if(el.id==='popq'){POPQ=el.value;render();return;}
  if(el.id==='tq'){TQ=el.value;OPEN='terr';render();return;}
  if(el.id==='gq'){GQ=el.value;render();return;}
  if(el.id==='skmq'&&SKM){SKM.q=el.value;SKM.lim=100;render();var l=$('#skmlist');if(l)l.scrollTop=0;return;}
  if(el.dataset.skmfq&&SKM){SKM.fq[el.dataset.skmfq]=el.value;render();return;}
  if(!F||el.tagName==='SELECT'||el.type==='checkbox')return;
  bindVal(el);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(VIEW==='promo'){if(el.tagName==='SELECT'||el.type==='date'){if(pbind(el)==='hard')render();}else if(el.dataset.pof!=null){pbind(el);pclamp(+el.dataset.pof,el);render();}else if(el.dataset.pit!=null&&el.dataset.f==='min'){pbind(el);render();}return;}
  if(!F)return;
  if(el.dataset.row&&(el.dataset.f==='min'||el.dataset.f==='k')){bindVal(el);render();return;}
  if(el.tagName!=='SELECT'&&el.type!=='checkbox')return;
  if(bindVal(el)==='hard')render();
});
document.addEventListener('scroll',function(e){var l=e.target;if(!SKM||!l||l.id!=='skmlist')return;if(l.scrollTop+l.clientHeight>l.scrollHeight-120&&SKM.lim<skmRows().length){SKM.lim+=100;render();}},true);
render();
})();
</script>
