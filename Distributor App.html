<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokrio Distributor App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Anek+Bangla:wght@400;600;700&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--t:#1591a1;--g:#1aac7a;--bg:#fafafa;--m3:#fef7ff;--ink:#212121;--mut:#757575;--org:#fb6340}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e9edf0}
body{font-family:'Anek Bangla',system-ui,sans-serif;color:#1e2a44;padding-block:20px 40px;padding-inline:16px}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}
button:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.stage{display:flex;justify-content:center}
.phone{position:relative;background:linear-gradient(145deg,#3a3d42,#17191c 40%,#2b2e33);border-radius:44px;padding:14px;box-shadow:0 0 0 2px #55595f,0 30px 60px -30px rgba(0,0,0,.6);zoom:.7397}
.phone::after{content:"";position:absolute;left:50%;top:30px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#050608;box-shadow:inset 0 0 0 3px #1c1f24;z-index:40}
@media (max-width:460px){.phone{zoom:.62}}
/* ---------- device: Samsung S25 Ultra, sizes in design units (557 wide) ---------- */
.scr{position:relative;width:557px;height:1237px;border-radius:30px;overflow:hidden;background:var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.sb{flex:0 0 40px;height:40px;padding:6px 6px 0;display:flex;align-items:center;gap:7px;font:500 12px/1 Roboto,Poppins,sans-serif;color:#3b3b3b;z-index:3}
.sb .gps{margin-left:auto}
.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* login (same as the SR App) */
.lg{padding:20px 43px 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.lg h1{font-size:52px;font-weight:500;line-height:1;text-align:center;margin-top:12px;letter-spacing:-.5px}
.lg .sub{font-size:24px;color:var(--mut);text-align:center;margin-top:2px}
.lg .clogo{display:block;width:230px;margin:48px auto 0}
.fl{font-size:23px;font-weight:500;margin-top:30px}
.fl.f1{margin-top:70px}
.fl+.box{margin-top:5px}
.box{display:flex;align-items:center;height:82px;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.07);padding:0 9px}
.box input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--ink);height:100%}
.box input::placeholder{color:var(--mut)}
.box .eye{color:#9e9e9e;display:flex;padding-top:24px}
.forgot{display:block;margin:18px 0 0 auto;font-size:22px;color:#64b5e8}
.fpw{position:relative;width:76px;height:76px;margin:40px auto 0;border-radius:50%;border:1.5px solid #6cbcc6;display:flex;align-items:center;justify-content:center}
.fpw img{width:62px;opacity:.9}
.fpw .lk{position:absolute;left:-26px;top:22px;width:28px;height:28px}
.btnp{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:70px;border-radius:10px;background:var(--t);color:#fff;font-size:28px;box-shadow:0 3px 6px rgba(0,0,0,.18)}
.btnp small{font-size:18px}
.lg .btnp{margin-top:60px}
/* app bar */
.ab{flex:0 0 48px;margin-top:-2px;display:flex;align-items:flex-start;justify-content:space-between;padding:0 16px 0 22px;position:relative;z-index:2}
.ab h2{position:absolute;left:90px;right:90px;top:0;line-height:44px;text-align:center;font-size:26px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab.l h2{left:96px;right:90px;text-align:left;font-weight:500}
.ab .sp{width:58px}
.ibx{width:58px;height:44px;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--t);position:relative}
.ibx .bdg{position:absolute;right:4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#ff5252;color:#fff;font:500 13px/20px Roboto,sans-serif;text-align:center;padding:0 4px;border:2px solid #fff}
/* home */
.home{padding:26px 25px 40px 31px}
.hc2{display:grid;grid-template-columns:238px 238px;gap:19px;margin-left:3px}
.hc2.one{grid-template-columns:495px}
.hcard.big i{right:16px;top:16px;width:64px;height:64px}
.hcard.big i img{width:44px}
.hcard{position:relative;height:176px;border-radius:8px;padding:72px 18px 0 16px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.1);background:#fff}
.hcard.t{background:var(--t);color:#fff}
.hcard b{display:block;font-size:23px;font-weight:600;line-height:1.2;white-space:nowrap}
.hcard span{display:block;font-size:18px;line-height:1.45;color:#9e9e9e}
.hcard.t span{color:#fff}
.hcard i{position:absolute;right:11px;top:11px;width:44px;height:44px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.hcard i img{width:28px}
.hcard em{position:absolute;left:16px;top:16px;font-style:normal;font-size:15px;font-weight:600;padding:2px 10px;border-radius:12px;background:rgba(255,255,255,.22);color:#fff}
.hcard:not(.t) em{background:#e8f4f6;color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(3,153px);column-gap:18px;row-gap:15px;margin:37px 0 0 3px}
.tile{position:relative;height:135px;border-radius:8px;background:var(--m3);box-shadow:0 2px 5px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:21px;font-weight:500;line-height:1.45;text-align:center;color:var(--ink)}
.tile img{width:40px;height:40px;object-fit:contain}
.tile.upt{padding-top:22px;gap:8px}
.tile .up{position:absolute;top:7px;right:7px;background:#fff1e0;color:#e8710a;font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:10px}
/* search + filters */
.srch{display:flex;align-items:center;height:62px;margin:14px 25px 0 31px;background:#fff;border-radius:8px;padding:0 16px 0 20px}
.srch input{flex:1;min-width:0;border:none;outline:none;font-size:23px;color:var(--ink);background:none}
.srch input::placeholder{color:#9e9e9e}
.srch svg{color:#9e9e9e;flex:0 0 auto}
.flt{display:flex;gap:12px;margin:12px 25px 0 31px}
.flt button{flex:1;min-width:0;height:50px;background:#fff;border-radius:8px;border:1.5px solid transparent;display:flex;align-items:center;gap:6px;padding:0 12px 0 16px;font-size:17px;color:#9e9e9e;white-space:nowrap}
.flt button b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left;font-weight:500;color:var(--ink)}
.flt button.on{border-color:var(--t)}
.flt button svg{flex:0 0 auto;color:var(--t)}
/* pending deliveries (Order List) */
.pdh{display:flex;align-items:center;justify-content:space-between;margin:22px 25px 0 31px;font-size:23px;height:34px}
.pdh b{color:var(--t);font-weight:600}
.pdh .all{display:flex;align-items:center;gap:16px;font-size:18px;color:#424242}
.cbx{width:28px;height:28px;border:2.5px solid #424242;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff}
.cbx.on{background:var(--t);border-color:var(--t)}
.olst{padding:16px 26px 150px 36px;display:flex;flex-direction:column;gap:26px}
.ocd{background:#fff;border-radius:8px 8px 0 0;box-shadow:0 2px 4px rgba(0,0,0,.2);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;width:100%;text-align:left;display:block}
.ocd .hd{background:var(--t);color:#fff;display:flex;align-items:center;padding:8px 0;border-radius:8px 8px 0 0}
.ocd .hd>div{flex:1;min-width:0;padding:0 6px 0 16px;font-size:19px;line-height:1.36;word-break:break-all}
.ocd .hd>div+div{border-left:1.5px solid rgba(255,255,255,.9)}
.ocd .hd>div>span{display:block;color:rgba(255,255,255,.78)}
.ocd .hd .ck{flex:0 0 52px;padding:0 0 0 14px;display:flex}
.ocd .rw{display:flex;border-top:1.5px solid #e2e2e2}
.ocd .rw>div{flex:1;min-width:0;padding:7px 8px 7px 16px;font-size:19px;line-height:1.4;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ocd .rw>div+div{border-left:1.5px solid #cfcfcf;margin:8px 0;padding-top:0;padding-bottom:0}
.ocd .rw span{display:block;color:#9e9e9e}
.ocd .rw .il span{display:inline}
.ocd.on{outline:3px solid var(--t);outline-offset:-1px}
.ocd.on .rw{background:#b8bfc5}
.ocd.on .rw span{color:var(--t)}
.ring{width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center}
.ring.on{background:#fff;color:var(--t)}
.bulk{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);height:66px;padding:0 44px;border-radius:33px;background:var(--t);color:#fff;font-size:25px;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.28);z-index:4;white-space:nowrap}
.empty{text-align:center;color:#9e9e9e;font-size:18px;padding:90px 20px 0}
/* order details */
.odh{padding:14px 34px 0}
.odh .so{font-size:17.5px;color:#424242;letter-spacing:.2px;font-weight:500}
.odh .so span{color:#4ba3e3;font-weight:400}
.odh .od{font-size:14.5px;color:#757575;margin-top:2px}
.odh .od b{font-weight:500;color:#424242}
.stps{display:flex;margin-top:26px;overflow-x:auto;scrollbar-width:none;padding-left:12px}
.stps::-webkit-scrollbar{display:none}
.stp{position:relative;flex:0 0 116px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stp i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d4d4d4;background:#fff;position:relative;z-index:1}
.stp i.ok{background:#3cb043;border-color:#3cb043;color:#fff}
.stp i.cur{border-color:#cfe8cf}
.stp i.cur::after{content:"";width:9px;height:9px;border-radius:50%;background:#3cb043}
.stp i.no{background:#e53935;border-color:#e53935;color:#fff}
.stp em{font-style:normal;font-size:17.5px;color:#757575;white-space:nowrap}
.stp::after{content:"";position:absolute;left:84px;top:14px;width:38px;height:2px;background:#ddd}
.stp.dn::after{background:#3cb043}
.tl{margin:40px 22px 0;background:#e8e5ea;border-radius:10px;overflow:hidden}
.tl.lt{background:var(--m3)}
.tl .tlh{width:100%;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 38px;font-size:19px;letter-spacing:.3px;color:#333}
.tl .tlh svg{transition:transform .2s}
.tl.open .tlh svg{transform:rotate(180deg)}
.tli{padding:0 30px 18px 38px}
.tli div{position:relative;padding:0 0 14px 24px;font-size:15px;color:#424242;line-height:1.4}
.tli div::before{content:"";position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:50%;background:var(--t)}
.tli div::after{content:"";position:absolute;left:4.5px;top:18px;bottom:2px;width:1px;background:#bdbdbd}
.tli div:last-child::after{display:none}
.tli b{font-weight:600;color:var(--ink)}
.tli small{display:block;font-size:13px;color:#757575}
.sep{height:2px;background:#ececec;margin:30px 22px 0}
.odt{display:flex;justify-content:space-between;align-items:center;margin:22px 22px 0 34px;min-height:50px}
.odt h3{font-size:19.5px;font-weight:500;letter-spacing:.6px}
.odt button{height:50px;padding:0 14px;background:#eee;border-radius:4px;font-size:17px;color:#333}
.pcds{padding:0 22px 40px 28px;display:flex;flex-direction:column;gap:18px;margin-top:16px}
.pcd{border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.18);background:var(--m3)}
.pcd .h{background:var(--t);color:#fff;font-size:17.5px;padding:0 16px;min-height:60px;display:flex;align-items:center;gap:8px}
.pcd .h b{font-weight:600}
.pcd .b{display:grid;grid-template-columns:1fr auto;row-gap:6px;padding:12px 16px;font-size:18.5px;color:#424242}
.pcd .b b{font-weight:500;color:var(--ink)}
.pcd .b div:nth-child(even){text-align:right}
.pcd .dq{color:#f57c00}
/* cart list */
.clst{padding:4px 24px 30px 28px;display:flex;flex-direction:column;gap:20px}
.ccd{background:var(--m3);box-shadow:0 2px 5px rgba(0,0,0,.2);border-radius:4px;padding:0 0 18px}
.ccd .tb{display:table;margin:0 auto;background:var(--t);color:#fff;font-size:17px;padding:16px 18px 18px;border-radius:6px 6px 0 0;max-width:90%}
.ccd .gr{display:grid;grid-template-columns:1fr auto;row-gap:10px;padding:22px 16px 0;font-size:19px;color:#424242}
.ccd .gr b{font-weight:500;color:var(--ink)}
.ccd .gr div:nth-child(even){text-align:right}
.ccd .of{text-align:right;color:#f4511e;font-size:19px;padding:10px 16px 0}
.ccd hr{border:none;border-top:1.5px solid #a0a0a0;margin:14px 0 18px}
.ccd .bt{display:flex;gap:26px;padding:0 24px 0 24px}
.ccd .bt button{flex:1;height:58px;font-size:22px;border-radius:4px}
.ccd .rm{border:1.5px solid #ef6c6c;color:#ef6c6c;background:#fff}
.ccd .ed{background:#64b5f0;color:#fff}
.cft{flex:0 0 auto;background:#fff;border-top:1.5px solid #e2e2e2;padding:12px 22px 20px;position:relative;z-index:2}
.cft .r{display:flex;font-size:20px;line-height:1.8;color:var(--ink)}
.cft .r span:first-child{flex:1}
.cft .r span:last-child{width:150px}
.cft hr{border:none;border-top:1px solid #555;margin:6px 0}
.cft .dn{width:100%;height:70px;background:var(--t);color:#fff;font-size:23px;letter-spacing:.6px;border-radius:5px;margin-top:12px}
.cft .two{display:flex;gap:38px;margin-top:16px}
.cft .two button{flex:1;height:70px;font-size:23px;letter-spacing:.6px;border-radius:5px;background:#fff}
.cft .cn{border:1.5px solid #e57373;color:#e57373}
.cft .ho{border:1.5px solid var(--t);color:var(--t)}
/* delivered list (563-wide screenshot, ~1:1) */
.dvab h2{font-weight:500}
.dvt{flex:0 0 42px;display:flex;align-items:center;margin:10px 0 0 9px;background:#fff;overflow-x:auto;scrollbar-width:none}
.dvt::-webkit-scrollbar{display:none}
.dvt button{flex:0 0 157px;height:100%;font:500 20px Poppins,sans-serif;color:#9e9e9e;border-radius:8px}
.dvt button.on{background:var(--t);color:#fff}
.dvt i{font-style:normal;color:#bdbdbd;font-size:16px}
.dvflt{margin:12px 22px 0 26px}
.dvflt button{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dvl{padding-top:20px!important}
.dvr{margin:10px 0 0 28px;font:400 13px Poppins,sans-serif;color:#616161}
.dvl{padding:30px 22px 150px 26px;display:flex;flex-direction:column;gap:13px}
.dvc{display:block;width:100%;text-align:left;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.14);padding:6px 6px 6px 7px}
.dvc .h{display:flex;align-items:center;gap:8px;padding:0 0 5px 0;border-bottom:1px solid #a5a5a5;font:400 10px Poppins,sans-serif;color:#222}
.dvc .h svg{color:#c06bd1}
.dvc .h em{margin-left:auto;font-style:normal;font:600 10px Poppins,sans-serif;color:#fff;background:#c06bd1;border-radius:3px;padding:3px 6px}
.dvc .o{display:flex;justify-content:space-between;align-items:center;gap:8px;height:33px;border-bottom:1px solid #a5a5a5;font:400 10px Poppins,sans-serif;color:#555;white-space:nowrap}
.dvc .o span{overflow:hidden;text-overflow:ellipsis}
.dvc .o b{font:500 12.5px Poppins,sans-serif;color:#111}
.dvc .m{display:grid;grid-template-columns:1fr auto;row-gap:12px;padding-top:7px;font:400 9.5px Poppins,sans-serif;color:#111}
.dvc .m span:nth-child(even){text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.dvc .m svg{color:#c06bd1}
.dvc.ac .h svg,.dvc.ac .m svg{color:#66bb6a}
.dvc.ac .h em{background:#81c784}
.dvfab{position:absolute;right:16px;bottom:62px;display:flex;gap:6px;z-index:4}
.dvfab button{width:44px;height:44px;border:2px solid #2a8f9c;border-radius:8px;background:#fff;color:#1e8796;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dvfab button span{display:flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:3px;background:#1e8796;color:#fff;font:800 9px Poppins,sans-serif;box-shadow:-3px 3px 0 #b9dfe4}
.dvft{position:absolute;left:0;right:0;bottom:0;height:46px;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -1px 4px rgba(0,0,0,.15);display:flex;justify-content:space-between;padding:0 50px 0 78px;z-index:3}
.dvft div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font:400 10px Poppins,sans-serif;color:#111}
.dvft b{font-weight:600}
/* delivered (Performance > Deliveries) */
.dtabs{display:flex;align-items:center;height:52px;margin:30px 0 0 12px;background:#fff;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:0 0 156px;height:100%;font-size:20px;color:#9e9e9e;border-radius:6px}
.dtabs button.on{background:var(--t);color:#fff}
.dtabs i{flex:0 0 auto;font-style:normal;color:#bdbdbd;font-size:20px}
.dlst{padding:44px 26px 150px 32px;display:flex;flex-direction:column;gap:24px}
.dcd{background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.16);padding:12px 12px 14px;text-align:left;width:100%;display:block}
.dcd .h{display:flex;align-items:center;gap:14px;font-size:20px;color:var(--ink);padding:0 0 12px 8px}
.dcd .h svg{color:#c06bd1;flex:0 0 auto}
.dcd .bg{margin-left:auto;background:#c26bd3;color:#fff;font-size:19px;font-weight:500;padding:3px 14px;border-radius:6px}
.dcd hr{border:none;border-top:1.5px solid #dcdcdc}
.dcd .o{display:flex;justify-content:space-between;gap:12px;padding:14px 4px 14px 4px;font-size:18.5px;color:#757575}
.dcd .o b{display:block;font-weight:400;color:var(--ink)}
.dcd .o>div:last-child{text-align:right;max-width:58%}
.dcd .o>div:last-child b{display:inline;font-size:20px;font-weight:500}
.dcd .m{display:grid;grid-template-columns:1fr auto;row-gap:22px;padding:14px 4px 0;font-size:18px;color:var(--ink)}
.dcd .m div:nth-child(even){text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.dcd .m svg{color:#c06bd1}
.dft{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -1px 6px rgba(0,0,0,.14);display:flex;justify-content:space-between;padding:18px 44px 20px 60px;font-size:19px;z-index:3}
.dft div{text-align:center}
.dft b{display:block;font-weight:500;margin-bottom:12px}
/* sales summary */
.ssf{display:flex;align-items:center;gap:8px;margin:28px 14px 0 10px;font-size:16.5px;color:var(--t);white-space:nowrap}
.ssf .dd{display:flex;align-items:center;gap:8px;border-bottom:2px solid #2196f3;padding:0 4px 4px 10px;color:var(--ink);font-size:18.5px;max-width:190px}
.ssf .dd span{overflow:hidden;text-overflow:ellipsis}
.ssf .dt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15.5px}
.ssf .dt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sslst{padding:30px 22px 150px 12px;display:flex;flex-direction:column;gap:30px}
.ssc{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.15);padding:16px 12px 20px;display:grid;grid-template-columns:1fr 1fr;row-gap:30px;column-gap:8px;font-size:15.5px}
.ssc div{display:flex;gap:12px;align-items:flex-start}
.ssc b{font-weight:500;color:#424242;flex:0 0 auto}
.ssc .oq{color:#f5a623;font-weight:600}

function day0(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function hm12(d){var h=d.getHours();return (h%12||12)+':'+p2(d.getMinutes())+' '+(h<12?'AM':'PM')}
function dLong(d){return p2(d.getDate())+' '+MS[d.getMonth()]+' '+d.getFullYear()}
function dPick(d){return d.getDate()+' '+MS[d.getMonth()]+', '+d.getFullYear()}
function inR(d,a,b){var x=day0(d);return x>=a&&x<=b}
function daysIn(a,b){return Math.round((b-a)/864e5)+1}
function f2(n){return n.toFixed(2)}
function f1(n){return n.toFixed(1)}
function hash(s){var h1=0x811c9dc5,out='';for(var k=0;k<4;k++){for(var i=0;i<s.length;i++){h1^=s.charCodeAt(i)+k;h1=Math.imul(h1,16777619)>>>0}out+=('0000000'+h1.toString(16)).slice(-8)}return out}

function timeline(o){var ev=[],t=o.at.getTime(),sr=srName(o.sr),db=DB.n+' ('+DB.c+')',H=36e5;

  if(cur>=2||o.st==='delivered')ev.push(['Processing',new Date(t+3*H),'Invoice created by '+db]);
  if(cur>=3||o.st==='delivered')ev.push(['On the way',new Date(t+4*H),'Loaded for delivery']);
  if(o.st==='delivered')ev.push(['Delivered',o.delAt,'Delivered by '+db]);
  if(o.st==='cancelled')ev.push(['Cancelled',o.cancAt,'Cancelled by '+db]);

V.dbs=function(){var f=S.st,key={Group:'grp',Category:'cat',Brand:'br'}[f.vb],l=PRODS.slice(),col=S.stCol||{};

  var row=function(p){var q=stQ(p,f.uom);return '<tr><td class="d">'+esc(p.n)+'</td><td class="l">'+esc(p.lot)+'</td><td class="'+(q<=0?'z':'')+'">'+nq(q)+'</td><td>'+f.uom+'</td><td>'+n2(stU(p,f.uom))+'</td><td>'+n2(p.stk*p.r)+'</td></tr>'};

   confirmDlg({t:'Bulk Deliver',m:'Deliver these orders now? All products will be delivered in full.',bx:'<div><span>Orders</span><b>'+l.length+'</b></div><div><span>Total</span><b>৳ '+f2(tot)+'</b></div><div><span>Due after delivery</span><b>৳ '+f2(tot)+'</b></div>',ok:'bulkok',okT:'Deliver'})},
 bulkok:function(){var l=ORD.filter(function(o){return S.pl.sel[o.id]}),need={};
   l.forEach(function(o){o.items.forEach(function(x){need[x.p]=(need[x.p]||0)+x.q})});
   if(Object.keys(need).some(function(p){return need[p]>PRODS[p].stk})){S.pop=null;S.dlg=null;render(true);toast("Some products' quantities are more than the available stock! Please set the amount to the available inventory.");return}
   l.forEach(function(o){deliver(o,o.items)});S.pl.sel={};S.pl.selMode=false;S.pop=null;S.dlg=null;render(true);toast(l.length+(l.length>1?' orders':' order')+' delivered successfully')},
 /* details & cart */
 tl:function(){S.tl=!S.tl;render(true)},
 edit:function(){var o=byId(S.cur);S.cart=o.items.map(function(x){return {p:x.p,q:x.q,dpp:x.dpp}});S.v='cart';S.pop=null;render()},
 dcard:function(e){S.cur=+e.dataset.id;S.from='delivered';S.tl=false;S.v='detail';render()},
 rm:function(e){var x=S.cart[+e.dataset.i];S.cart.splice(+e.dataset.i,1);render(true);toast(PRODS[x.p].n+' removed')},
 eq:function(e){var i=+e.dataset.i;S.dlg={k:'edit',i:i,q:S.cart[i].q};S.pop='dlg';render(true)},
 eqs:function(e){S.dlg.q=Math.max(0,(+S.dlg.q||0)+(+e.dataset.v));var el=$('#eqi');if(el)el.value=S.dlg.q},
 eqok:function(){var q=parseInt(S.dlg.q,10)||0,x=S.cart[S.dlg.i];
   if(q<=0){S.cart.splice(S.dlg.i,1)}else if(q>PRODS[x.p].stk){toast('Only '+f1(PRODS[x.p].stk)+' in stock');return}else x.q=q;
   S.pop=null;S.dlg=null;render(true)},
 addp:function(e){var p=+e.dataset.v;S.cart.push({p:p,q:1,dpp:0});S.pop=null;render(true);toast(PRODS[p].n+' added')},
 delnow:function(){var o=byId(S.cur),c=S.cart;
   if(!c.length){toast("You don't have any product selected. Please select some product to confirm delivery.");return}
   if(c.some(function(x){return PRODS[x.p].stk<=0})){toast('Some products are out of stock! Please remove them from the cart.');return}
   if(stockShort(c)){toast("Some products' quantities are more than the available stock! Please set the amount to the available inventory.");return}
   confirmDlg({t:'Deliver Now',m:'Deliver this order to '+esc(OUT[o.out].n)+'?',bx:'<div><span>Products</span><b>'+c.length+'</b></div><div><span>P.total</span><b>৳ '+f2(ptotal(c))+'</b></div>',ok:'delok',okT:'Deliver'})},
 delok:function(){var o=byId(S.cur);deliver(o,S.cart);S.cart=null;S.dlg=null;go('pending');toast('Order delivered successfully')},
 cancelord:function(){confirmDlg({t:'Cancel Order',m:'Do you want to cancel this order? It will leave Pending Deliveries.',ok:'cancok',okT:'Yes, Cancel',no:'No',danger:true})},
 cancok:function(){var o=byId(S.cur);o.st='cancelled';o.cancAt=new Date();S.dlg=null;go('pending');toast('Order cancelled')},
 holdord:function(){var o=byId(S.cur);o.items=S.cart.map(function(x){return {p:x.p,q:x.q,dpp:x.dpp,dq:x.q}});o.hold=true;o.holdAt=new Date();go('pending');toast('Order is on hold')},
 /* delivered */
 dtab:function(e){S.dv.tab=+e.dataset.v;render(true)},
 acard:function(e){S.cur=+e.dataset.id;S.from='accepted';S.tl=false;S.v='detail';render()},
 /* filters */
 sheet:function(e){S.sheet=e.dataset.v;S.sh.q='';if(S.sheet==='stf')S.stTmp={br:Object.assign({},S.st.br),cat:Object.assign({},S.st.cat)};S.pop='sheet';render(true)},
 pick:function(e){var k=e.dataset.k,v=+e.dataset.v;
   if(k==='dsr'||k==='drt'){var g=S.dvf=S.dvf||{sr:-1,rt:-1};if(k==='dsr'){g.sr=v;if(v>=0&&g.rt>=0&&ROUTES[g.rt].sr!==v)g.rt=-1}else g.rt=v;S.pop=null;render(true);return}
   if(k==='sr'){S.pl.sr=v;if(v>=0&&S.pl.rt>=0&&ROUTES[S.pl.rt].sr!==v)S.pl.rt=-1}
   if(k==='rt')S.pl.rt=v;if(k==='ssr'){S.ss.sr=v;if(v>=0&&S.ss.rt>=0&&ROUTES[S.ss.rt].sr!==v)S.ss.rt=-1}if(k==='ssrt')S.ss.rt=v;
   if(k!=='ssr'&&k!=='ssrt'){S.pl.sel={};S.pl.selMode=false}
   S.pop=null;render(true)},
 stfilter:function(){S.stTmp={vb:S.st.vb,uom:S.st.uom};S.dd=null;S.pop='stf';render(true)},
 ddopen:function(e){S.dd=S.dd===e.dataset.v?null:e.dataset.v;render(true)},
 ddpick:function(e){var t=S.stTmp,k=e.dataset.k,v=e.dataset.v;t[k]=v;if(k==='sb')t.so=v==='None'?'As is':(t.so==='As is'?'Ascending':t.so);S.dd=null;render(true)},
 stfok:function(){S.st.vb=S.stTmp.vb;S.st.uom=S.stTmp.uom;S.stReady=true;S.pop=null;S.dd=null;render(true)},
 stsort:function(){S.stTmp={sb:S.st.sb,so:S.st.so};S.dd=null;S.pop='stsort';render(true)},
 stsortok:function(){S.st.sb=S.stTmp.sb;S.st.so=S.stTmp.so;S.pop=null;S.dd=null;render(true)},
 stdl:function(){toast('Stock report downloading…')},
 stgrp:function(e){S.stCol=S.stCol||{};S.stCol[e.dataset.v]=!S.stCol[e.dataset.v];render(true)},
 print:function(){toast('Connect a Bluetooth printer to print')},
 /* date range picker */
 rp:function(e){var t=e.dataset.v,src=t==='pl'?S.pl:t==='ss'?S.ss:{a:dvRange()[0],b:dvRange()[1]};
   S.rp={t:t,a:new Date(src.a),b:new Date(src.b),step:0,m:new Date(src.b.getFullYear(),src.b.getMonth(),1)};S.pop='rp';render(true)},
 rpstep:function(e){S.rp.step=+e.dataset.v;render(true)},
 rpm:function(e){var m=S.rp.m;S.rp.m=new Date(m.getFullYear(),m.getMonth()+(+e.dataset.v),1);render(true)},
 rpd:function(e){var r=S.rp,d=new Date(r.m.getFullYear(),r.m.getMonth(),+e.dataset.v);
   if(r.step===0||!r.a){r.a=d;r.b=null;r.step=1}else if(d<r.a){r.a=d;r.b=null}else{r.b=d;r.step=0}render(true)},
 rpok:function(){var r=S.rp,b=r.b||r.a;
   if(r.t==='pl'){S.pl.a=r.a;S.pl.b=b;S.pl.sel={};S.pl.selMode=false}
   else if(r.t==='ss'){S.ss.a=r.a;S.ss.b=b}
   else{S.dv.tab=-1;S.dv.a=r.a;S.dv.b=b}
   S.pop=null;S.rp=null;render(true)},
 /* help & knowledge hub */
 call:function(){toast('Calling +880 9610-000000 …')},
 mail:function(){toast('Opening email to support@sokrio.com …')},
 rate:function(e){S.rate=+e.dataset.v;render(true);toast('Thank you for your feedback')},
 khopen:function(e){var i=+e.dataset.v,k=KH[i];S.kh=i;if(k.go==='video'){toast('Video will play in YouTube');return}if(k.go==='url'){window.open(k.url,'_blank','noopener');return}go(k.go)},
 khtab:function(e){S.khTab=e.dataset.v;render(true)},
 helpsheet:function(){S.pop='help';render(true)},
 hchat:function(){toast('Opening support chat …')},
 hcall:function(){toast('Calling +880 9610-000000 …')}
};
/* long-press an order card to start selecting (as in the SR App) */
var lp=null;
scr.addEventListener('pointerdown',function(ev){var c=ev.target.closest('.ocd');if(!c||S.pl.selMode)return;var id=+c.dataset.id;
  lp={x:ev.clientX,y:ev.clientY,fired:false,t:setTimeout(function(){lp.fired=true;S.pl.selMode=true;S.pl.sel={};S.pl.sel[id]=true;render(true)},480)}});
scr.addEventListener('pointermove',function(ev){if(lp&&!lp.fired&&(Math.abs(ev.clientX-lp.x)>10||Math.abs(ev.clientY-lp.y)>10)){clearTimeout(lp.t);lp=null}});
['pointerup','pointercancel'].forEach(function(n){scr.addEventListener(n,function(){if(lp&&!lp.fired){clearTimeout(lp.t);lp=null}})});
scr.addEventListener('contextmenu',function(ev){if(ev.target.closest('.ocd'))ev.preventDefault()});
scr.addEventListener('click',function(ev){
  if(lp&&lp.fired){lp=null;return}
  var el=ev.target.closest('[data-act]');if(!el||!scr.contains(el)||el.disabled)return;var f=A[el.dataset.act];if(f)f(el)});
scr.addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('ocd')){ev.preventDefault();A.ocard(ev.target)}});
function keepInput(id,set){var t=$('#'+id),p=t.selectionStart;set(t.value);render(true);var n=$('#'+id);if(n){n.focus();n.setSelectionRange(p,p)}}
scr.addEventListener('input',function(ev){var t=ev.target;
  if(t.id==='q')keepInput('q',function(v){S.pl.q=v});
  else if(t.id==='shq')keepInput('shq',function(v){S.sh.q=v});
  else if(t.id==='eqi'){S.dlg.q=t.value.replace(/\D/g,'')}});
setInterval(function(){var s=scr.querySelector('.sb span');if(s)s.textContent=hmNow()},30000);

var HS=new URLSearchParams(location.hash.slice(1));
if(HS.get('go')){S.v=HS.get('go');if(HS.get('cur'))S.cur=+HS.get('cur');if(HS.get('from'))S.from=HS.get('from');document.body.classList.add('shot')}
render();
/* screenshot helper: #go=pending&do=ocard:625,edit runs actions after load */
if(HS.get('do'))HS.get('do').split(',').forEach(function(s){var p=s.split(':'),v=p[1]||'';A[p[0]]({dataset:{v:v,id:v,i:v,k:p[2]||''}})});
window.__DA={S:function(){return S},A:A,go:go,ORD:ORD};
})();
</script>
